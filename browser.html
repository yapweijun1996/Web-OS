<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Browser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111318; color: #f5f7fb; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 320px;
      overflow: hidden;
    }
    .toolbar {
      display: grid;
      grid-template-columns: auto auto 1fr auto auto;
      gap: 7px;
      align-items: center;
      padding: 8px;
      background: rgba(255,255,255,.075);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .nav-group { display: flex; gap: 5px; }
    button, input {
      height: 31px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      font: inherit;
      color: inherit;
    }
    button {
      min-width: 34px;
      padding: 0 10px;
      background: rgba(255,255,255,.1);
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.16); }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #0a84ff;
      outline-offset: 1px;
    }
    button.primary { background: #0a84ff; border-color: #0a84ff; }
    button.icon { width: 34px; padding: 0; font-size: 15px; }
    input {
      width: 100%;
      padding: 0 11px;
      background: rgba(0,0,0,.28);
    }
    .workspace {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      padding: 10px;
      background: rgba(0,0,0,.16);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .site {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 50px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 8px;
      background: rgba(255,255,255,.055);
      color: inherit;
      text-align: left;
    }
    .site:hover { background: rgba(255,255,255,.095); }
    .site-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      background: rgba(10,132,255,.16);
    }
    .site-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }
    .site-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #aeb4c0;
      font-size: 11px;
      margin-top: 2px;
    }
    .frame-wrap { position: relative; min-height: 0; background: #fff; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(17,19,24,.86);
      color: #d7dbe4;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .16s, transform .16s;
      pointer-events: none;
    }
    .status.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 620px) {
      .toolbar { grid-template-columns: auto 1fr auto auto; }
      .nav-group.secondary { display: none; }
      .suggestions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 420px) {
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <form class="toolbar" id="browser-form">
    <div class="nav-group">
      <button type="button" class="icon" id="back-btn" title="Back" aria-label="Back">‹</button>
      <button type="button" class="icon" id="forward-btn" title="Forward" aria-label="Forward">›</button>
      <button type="button" class="icon" id="reload-btn" title="Reload" aria-label="Reload">↻</button>
    </div>
    <div class="nav-group secondary">
      <button type="button" class="icon" id="home-btn" title="Home" aria-label="Home">⌂</button>
    </div>
    <input id="address-input" name="address" autocomplete="url" spellcheck="false" aria-label="Address or search">
    <button type="submit" class="primary">Go</button>
    <button type="button" class="icon" id="external-btn" title="Open in New Tab" aria-label="Open in New Tab">↗</button>
  </form>

  <main class="workspace">
    <section class="suggestions" id="suggestions" aria-label="Suggested websites"></section>
    <div class="frame-wrap">
      <iframe id="browser-frame" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-forms allow-popups allow-popups-to-escape-sandbox allow-scripts allow-same-origin"></iframe>
      <div class="status" id="status"></div>
    </div>
  </main>

  <script type="module">
    const DEFAULT_SITES = [
      { title: 'Yap Wei Jun', url: 'https://yapweijun1996.com/', icon: 'YW' },
      { title: 'GitHub Profile', url: 'https://github.com/yapweijun1996', icon: 'GH' },
      { title: 'GitHub', url: 'https://github.com/', icon: 'GH' },
      { title: 'OpenAI', url: 'https://openai.com/', icon: 'AI' },
      { title: 'ChatGPT', url: 'https://chatgpt.com/', icon: 'CG' },
      { title: 'MDN Web Docs', url: 'https://developer.mozilla.org/', icon: 'MD' },
      { title: 'npm', url: 'https://www.npmjs.com/', icon: 'np' },
      { title: 'Vercel', url: 'https://vercel.com/', icon: '▲' }
    ];

    const form = document.getElementById('browser-form');
    const input = document.getElementById('address-input');
    const frame = document.getElementById('browser-frame');
    const suggestions = document.getElementById('suggestions');
    const status = document.getElementById('status');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const homeBtn = document.getElementById('home-btn');
    const externalBtn = document.getElementById('external-btn');
    const historyStack = [];
    let historyIndex = -1;
    let statusTimer = null;

    function normalizeTarget(value) {
      const raw = value.trim();
      if (!raw) return DEFAULT_SITES[0].url;
      if (/^https?:\/\//i.test(raw)) return raw;
      if (/^[a-z0-9.-]+\.[a-z]{2,}([/:?#].*)?$/i.test(raw)) return `https://${raw}`;
      return `https://www.google.com/search?q=${encodeURIComponent(raw)}`;
    }

    function setStatus(message) {
      status.textContent = message;
      status.classList.add('visible');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove('visible'), 3200);
    }

    function setNavState() {
      backBtn.disabled = historyIndex <= 0;
      forwardBtn.disabled = historyIndex >= historyStack.length - 1;
    }

    function navigate(url, { push = true } = {}) {
      const target = normalizeTarget(url);
      frame.src = target;
      input.value = target;
      if (push) {
        historyStack.splice(historyIndex + 1);
        historyStack.push(target);
        historyIndex = historyStack.length - 1;
      }
      setNavState();
      setStatus(`Loading ${new URL(target).hostname}`);
    }

    function renderSuggestions() {
      suggestions.replaceChildren();
      DEFAULT_SITES.forEach((site) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'site';
        button.title = site.url;
        button.addEventListener('click', () => navigate(site.url));

        const icon = document.createElement('div');
        icon.className = 'site-icon';
        icon.textContent = site.icon;

        const copy = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'site-title';
        title.textContent = site.title;
        const url = document.createElement('div');
        url.className = 'site-url';
        url.textContent = site.url.replace(/^https?:\/\//, '');
        copy.append(title, url);

        button.append(icon, copy);
        suggestions.appendChild(button);
      });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      navigate(input.value);
    });

    backBtn.addEventListener('click', () => {
      if (historyIndex <= 0) return;
      historyIndex -= 1;
      navigate(historyStack[historyIndex], { push: false });
    });

    forwardBtn.addEventListener('click', () => {
      if (historyIndex >= historyStack.length - 1) return;
      historyIndex += 1;
      navigate(historyStack[historyIndex], { push: false });
    });

    reloadBtn.addEventListener('click', () => {
      try {
        frame.contentWindow.location.reload();
      } catch {
        frame.src = frame.src;
      }
      setStatus('Reloading page');
    });

    homeBtn.addEventListener('click', () => navigate(DEFAULT_SITES[0].url));
    externalBtn.addEventListener('click', () => {
      window.open(normalizeTarget(input.value), '_blank', 'noopener,noreferrer');
    });

    frame.addEventListener('load', () => {
      setStatus('Page loaded');
    });

    renderSuggestions();
    navigate(DEFAULT_SITES[0].url);
  </script>
</body>
</html>
