<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Browser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111318; color: #f5f7fb; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 320px;
      overflow: hidden;
    }
    .toolbar {
      display: grid;
      grid-template-columns: auto auto 1fr auto auto;
      gap: 7px;
      align-items: center;
      padding: 8px;
      background: rgba(255,255,255,.075);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .nav-group { display: flex; gap: 5px; }
    button, input {
      height: 31px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      font: inherit;
      color: inherit;
    }
    button {
      min-width: 34px;
      padding: 0 10px;
      background: rgba(255,255,255,.1);
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.16); }
    button:focus-visible, input:focus-visible, .site:focus-visible {
      outline: 2px solid #0a84ff;
      outline-offset: 1px;
    }
    button.primary { background: #0a84ff; border-color: #0a84ff; }
    button.icon { width: 34px; padding: 0; font-size: 15px; }
    input {
      width: 100%;
      padding: 0 11px;
      background: rgba(0,0,0,.28);
    }
    .workspace {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      padding: 10px;
      background: rgba(0,0,0,.16);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .bookmark-editor {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(110px, .8fr) minmax(170px, 1.4fr) minmax(56px, .3fr) auto;
      gap: 7px;
      align-items: center;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      background: rgba(0,0,0,.18);
    }
    .bookmark-editor input { height: 30px; }
    .bookmark-editor button { height: 30px; }
    .site {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 50px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 8px;
      background: rgba(255,255,255,.055);
      color: inherit;
      text-align: left;
    }
    .site:hover { background: rgba(255,255,255,.095); }
    .site-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      background: rgba(10,132,255,.16);
    }
    .site-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }
    .site-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #aeb4c0;
      font-size: 11px;
      margin-top: 2px;
    }
    .site-badge {
      display: inline-flex;
      width: fit-content;
      margin-top: 5px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(10,132,255,.18);
      color: #b9d8ff;
      font-size: 10px;
      font-weight: 650;
    }
    .site-mode {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 5px;
      margin-top: 2px;
    }
    .mode-btn {
      min-width: 0;
      height: 24px;
      border-radius: 6px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 650;
      background: rgba(255,255,255,.08);
    }
    .mode-btn.active {
      border-color: rgba(10,132,255,.8);
      background: rgba(10,132,255,.32);
      color: #e8f3ff;
    }
    .delete-btn {
      min-width: 30px;
      width: 30px;
      padding: 0;
      color: #ffd7d7;
      background: rgba(255,95,87,.16);
    }
    .frame-wrap { position: relative; min-height: 0; background: #fff; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .external-panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #151821;
      color: #f5f7fb;
    }
    .external-panel[hidden] { display: none; }
    .external-card {
      width: min(440px, 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.24);
    }
    .external-card h1 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.25;
    }
    .external-card p {
      margin: 0 0 14px;
      color: #b8beca;
      font-size: 13px;
      line-height: 1.5;
    }
    .external-card .target {
      overflow-wrap: anywhere;
      margin-bottom: 14px;
      color: #d8e8ff;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(17,19,24,.86);
      color: #d7dbe4;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .16s, transform .16s;
      pointer-events: none;
    }
    .status.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 620px) {
      .toolbar { grid-template-columns: auto 1fr auto auto; }
      .nav-group.secondary { display: none; }
      .suggestions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bookmark-editor { grid-template-columns: 1fr 1fr; }
      .bookmark-editor input[name="url"] { grid-column: 1 / -1; }
    }
    @media (max-width: 420px) {
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <form class="toolbar" id="browser-form">
    <div class="nav-group">
      <button type="button" class="icon" id="back-btn" title="Back" aria-label="Back">‹</button>
      <button type="button" class="icon" id="forward-btn" title="Forward" aria-label="Forward">›</button>
      <button type="button" class="icon" id="reload-btn" title="Reload" aria-label="Reload">↻</button>
    </div>
    <div class="nav-group secondary">
      <button type="button" class="icon" id="home-btn" title="Home" aria-label="Home">⌂</button>
    </div>
    <input id="address-input" name="address" autocomplete="url" spellcheck="false" aria-label="Address or search">
    <button type="submit" class="primary">Go</button>
    <button type="button" class="icon" id="external-btn" title="Open in New Tab" aria-label="Open in New Tab">↗</button>
  </form>

  <main class="workspace">
    <section class="suggestions" id="suggestions" aria-label="Suggested websites"></section>
    <div class="frame-wrap">
      <iframe id="browser-frame" credentialless referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-forms allow-popups allow-popups-to-escape-sandbox allow-scripts"></iframe>
      <div class="external-panel" id="external-panel" hidden>
        <div class="external-card">
          <h1 id="external-title">Open in a real browser tab</h1>
          <p id="external-message">This website does not allow embedded browsers. Use a normal browser tab for the full site.</p>
          <div class="target" id="external-target"></div>
          <button type="button" class="primary" id="open-current-btn">Open Site</button>
        </div>
      </div>
      <div class="status" id="status"></div>
    </div>
  </main>

  <script type="module">
    const MODE_STORAGE_KEY = 'vortex_browser_site_modes';
    const CUSTOM_STORAGE_KEY = 'vortex_browser_custom_sites';
    const EXTERNAL_ONLY_HOSTS = new Set([
      'chatgpt.com',
      'github.com',
      'google.com',
      'openai.com',
      'vercel.com',
      'yapweijun1996.com'
    ]);
    const DEFAULT_SITES = [
      { id: 'yapweijun', title: 'Yap Wei Jun', url: 'https://yapweijun1996.com/', icon: 'YW', defaultMode: 'tab', externalOnly: true },
      { id: 'github-profile', title: 'GitHub Profile', url: 'https://github.com/yapweijun1996', icon: 'GH', defaultMode: 'tab', externalOnly: true },
      { id: 'github', title: 'GitHub', url: 'https://github.com/', icon: 'GH', defaultMode: 'tab', externalOnly: true },
      { id: 'openai', title: 'OpenAI', url: 'https://openai.com/', icon: 'AI', defaultMode: 'tab', externalOnly: true },
      { id: 'chatgpt', title: 'ChatGPT', url: 'https://chatgpt.com/', icon: 'CG', defaultMode: 'tab', externalOnly: true },
      { id: 'mdn', title: 'MDN Web Docs', url: 'https://developer.mozilla.org/', icon: 'MD', defaultMode: 'embed' },
      { id: 'npm', title: 'npm', url: 'https://www.npmjs.com/', icon: 'np', defaultMode: 'embed' },
      { id: 'vercel', title: 'Vercel', url: 'https://vercel.com/', icon: '▲', defaultMode: 'tab', externalOnly: true }
    ];

    const form = document.getElementById('browser-form');
    const input = document.getElementById('address-input');
    const frame = document.getElementById('browser-frame');
    const externalPanel = document.getElementById('external-panel');
    const externalTitle = document.getElementById('external-title');
    const externalMessage = document.getElementById('external-message');
    const externalTarget = document.getElementById('external-target');
    const suggestions = document.getElementById('suggestions');
    const status = document.getElementById('status');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const homeBtn = document.getElementById('home-btn');
    const externalBtn = document.getElementById('external-btn');
    const openCurrentBtn = document.getElementById('open-current-btn');
    const historyStack = [];
    let historyIndex = -1;
    let currentUrl = DEFAULT_SITES[0].url;
    let siteModes = loadSiteModes();
    let customSites = loadCustomSites();
    let statusTimer = null;

    function loadSiteModes() {
      try {
        const value = JSON.parse(localStorage.getItem(MODE_STORAGE_KEY) || '{}');
        return value && typeof value === 'object' ? value : {};
      } catch {
        return {};
      }
    }

    function saveSiteModes() {
      localStorage.setItem(MODE_STORAGE_KEY, JSON.stringify(siteModes));
    }

    function loadCustomSites() {
      try {
        const value = JSON.parse(localStorage.getItem(CUSTOM_STORAGE_KEY) || '[]');
        if (!Array.isArray(value)) return [];
        return value.filter((site) =>
          site &&
          typeof site.id === 'string' &&
          typeof site.title === 'string' &&
          typeof site.url === 'string'
        );
      } catch {
        return [];
      }
    }

    function saveCustomSites() {
      localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(customSites));
    }

    function allSites() {
      return [...DEFAULT_SITES, ...customSites];
    }

    function siteMode(site) {
      const saved = siteModes[site.id];
      if (saved === 'embed' || saved === 'tab') return saved;
      return site.defaultMode || (site.externalOnly ? 'tab' : 'embed');
    }

    function setSiteMode(site, mode) {
      siteModes = { ...siteModes, [site.id]: mode };
      saveSiteModes();
      renderSuggestions();
      setStatus(`${site.title} opens in ${mode === 'tab' ? 'a browser tab' : 'the Web OS window'}`);
    }

    function addCustomSite({ title, url, icon }) {
      const target = normalizeTarget(url);
      const next = {
        id: `custom-${Date.now()}`,
        title: title.trim(),
        url: target,
        icon: (icon.trim() || title.trim().slice(0, 2) || '★').slice(0, 2),
        defaultMode: externalOnly(target) ? 'tab' : 'embed',
        custom: true
      };
      customSites = [...customSites, next];
      saveCustomSites();
      renderSuggestions();
      setStatus(`Added bookmark: ${next.title}`);
    }

    function deleteCustomSite(site) {
      customSites = customSites.filter((item) => item.id !== site.id);
      delete siteModes[site.id];
      saveCustomSites();
      saveSiteModes();
      renderSuggestions();
      setStatus(`Removed bookmark: ${site.title}`);
    }

    function normalizeTarget(value) {
      const raw = value.trim();
      if (!raw) return DEFAULT_SITES[0].url;
      if (/^https?:\/\//i.test(raw)) return raw;
      if (/^[a-z0-9.-]+\.[a-z]{2,}([/:?#].*)?$/i.test(raw)) return `https://${raw}`;
      return `https://www.google.com/search?q=${encodeURIComponent(raw)}`;
    }

    function externalOnly(url) {
      try {
        const host = new URL(url).hostname.replace(/^www\./, '');
        return EXTERNAL_ONLY_HOSTS.has(host);
      } catch {
        return false;
      }
    }

    function setStatus(message) {
      status.textContent = message;
      status.classList.add('visible');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove('visible'), 3200);
    }

    function setNavState() {
      backBtn.disabled = historyIndex <= 0;
      forwardBtn.disabled = historyIndex >= historyStack.length - 1;
    }

    function openExternal(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function showExternalPanel(url, { open = false, blocked = false } = {}) {
      currentUrl = url;
      input.value = url;
      externalTitle.textContent = blocked ? 'Embedding blocked by this website' : 'Open in a real browser tab';
      externalMessage.textContent = blocked
        ? 'This site sends browser security headers such as X-Frame-Options or frame-ancestors, so Web OS cannot display it inside an iframe.'
        : 'This bookmark is set to open in a normal browser tab for the full site.';
      externalTarget.textContent = url;
      externalPanel.hidden = false;
      frame.removeAttribute('src');
      if (open) openExternal(url);
      setStatus(open ? 'Opened in a browser tab' : 'Open this site in a browser tab');
    }

    function navigate(url, { push = true, mode = 'embed', openBlocked = false } = {}) {
      const target = normalizeTarget(url);
      currentUrl = target;
      input.value = target;
      if (push) {
        historyStack.splice(historyIndex + 1);
        historyStack.push(target);
        historyIndex = historyStack.length - 1;
      }
      setNavState();
      if (mode === 'tab') {
        showExternalPanel(target, { open: openBlocked });
        return;
      }
      if (externalOnly(target)) {
        showExternalPanel(target, { blocked: true });
        return;
      }
      externalPanel.hidden = true;
      frame.src = target;
      setStatus(`Loading ${new URL(target).hostname}`);
    }

    function navigateSite(site, { openBlocked = true } = {}) {
      navigate(site.url, { mode: siteMode(site), openBlocked });
    }

    function renderBookmarkEditor() {
      const editor = document.createElement('div');
      editor.className = 'bookmark-editor';

      const title = document.createElement('input');
      title.name = 'title';
      title.placeholder = 'Bookmark name';
      title.autocomplete = 'off';
      title.setAttribute('aria-label', 'Bookmark name');

      const url = document.createElement('input');
      url.name = 'url';
      url.placeholder = 'https://example.com';
      url.autocomplete = 'url';
      url.setAttribute('aria-label', 'Bookmark URL');

      const icon = document.createElement('input');
      icon.name = 'icon';
      icon.placeholder = 'Icon';
      icon.maxLength = 2;
      icon.autocomplete = 'off';
      icon.setAttribute('aria-label', 'Bookmark icon');

      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'primary';
      add.textContent = 'Add';
      add.addEventListener('click', () => {
        if (!title.value.trim() || !url.value.trim()) {
          setStatus('Bookmark name and URL are required');
          return;
        }
        addCustomSite({ title: title.value, url: url.value, icon: icon.value });
      });

      editor.append(title, url, icon, add);
      return editor;
    }

    function renderSuggestions() {
      suggestions.replaceChildren(renderBookmarkEditor());
      allSites().forEach((site) => {
        const mode = siteMode(site);
        const item = document.createElement('div');
        item.className = 'site';
        item.title = site.url;
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.addEventListener('click', () => navigateSite(site));
        item.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            navigateSite(site);
          }
        });

        const icon = document.createElement('div');
        icon.className = 'site-icon';
        icon.textContent = site.icon;

        const copy = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'site-title';
        title.textContent = site.title;
        const url = document.createElement('div');
        url.className = 'site-url';
        url.textContent = site.url.replace(/^https?:\/\//, '');
        copy.append(title, url);
        if (mode === 'tab') {
          const badge = document.createElement('div');
          badge.className = 'site-badge';
          badge.textContent = 'NEW TAB';
          copy.appendChild(badge);
        }

        const controls = document.createElement('div');
        controls.className = 'site-mode';
        ['embed', 'tab'].forEach((option) => {
          const modeButton = document.createElement('button');
          modeButton.type = 'button';
          modeButton.className = 'mode-btn' + (mode === option ? ' active' : '');
          modeButton.textContent = option === 'embed' ? 'Embed' : 'Tab';
          modeButton.setAttribute('aria-pressed', mode === option ? 'true' : 'false');
          modeButton.addEventListener('click', (event) => {
            event.stopPropagation();
            setSiteMode(site, option);
          });
          controls.appendChild(modeButton);
        });
        if (site.custom) {
          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'delete-btn';
          deleteButton.title = `Delete ${site.title}`;
          deleteButton.setAttribute('aria-label', `Delete ${site.title}`);
          deleteButton.textContent = '×';
          deleteButton.addEventListener('click', (event) => {
            event.stopPropagation();
            deleteCustomSite(site);
          });
          controls.appendChild(deleteButton);
        }

        item.append(icon, copy, controls);
        suggestions.appendChild(item);
      });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const target = normalizeTarget(input.value);
      navigate(target, { mode: externalOnly(target) ? 'tab' : 'embed', openBlocked: true });
    });

    backBtn.addEventListener('click', () => {
      if (historyIndex <= 0) return;
      historyIndex -= 1;
      navigate(historyStack[historyIndex], { push: false });
    });

    forwardBtn.addEventListener('click', () => {
      if (historyIndex >= historyStack.length - 1) return;
      historyIndex += 1;
      navigate(historyStack[historyIndex], { push: false });
    });

    reloadBtn.addEventListener('click', () => {
      if (externalPanel.hidden === false) {
        openExternal(currentUrl);
        return;
      }
      try {
        frame.contentWindow.location.reload();
      } catch {
        frame.src = frame.src;
      }
      setStatus('Reloading page');
    });

    homeBtn.addEventListener('click', () => navigateSite(DEFAULT_SITES[0], { openBlocked: false }));
    externalBtn.addEventListener('click', () => {
      openExternal(normalizeTarget(input.value));
    });
    openCurrentBtn.addEventListener('click', () => openExternal(currentUrl));

    frame.addEventListener('load', () => {
      setStatus('Page loaded');
    });

    renderSuggestions();
    navigateSite(DEFAULT_SITES[0], { openBlocked: false });
  </script>
</body>
</html>
