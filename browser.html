<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Browser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #202124; color: #f1f3f4; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 320px;
      overflow: hidden;
    }
    .chrome-shell {
      background: #2b2c31;
      border-bottom: 1px solid rgba(0,0,0,.42);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
    }
    .tab-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      min-height: 36px;
      padding: 5px 8px 0;
      gap: 6px;
      background: #202124;
    }
    .tab-strip {
      display: flex;
      gap: 2px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-strip::-webkit-scrollbar { display: none; }
    .tab {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: clamp(132px, 22vw, 220px);
      min-width: 112px;
      height: 31px;
      padding: 0 6px 0 12px;
      border: 0;
      border-radius: 9px 9px 0 0;
      background: transparent;
      color: #c7c9cf;
    }
    .tab:hover { background: rgba(255,255,255,.08); }
    .tab.active {
      background: #2b2c31;
      color: #fff;
    }
    .tab-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
    }
    .tab-close {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: 15px;
      line-height: 1;
    }
    .tab-close:hover { background: rgba(255,255,255,.14); }
    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto auto auto;
      gap: 7px;
      align-items: center;
      padding: 7px 8px 8px;
      background: #2b2c31;
    }
    .nav-group { display: flex; gap: 5px; }
    button, input {
      height: 32px;
      border: 1px solid transparent;
      border-radius: 16px;
      font: inherit;
      color: inherit;
    }
    button {
      min-width: 32px;
      padding: 0 10px;
      background: transparent;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.1); }
    button:disabled {
      cursor: default;
      opacity: .45;
    }
    button:disabled:hover { background: transparent; }
    button:focus-visible, input:focus-visible, .site:focus-visible {
      outline: 2px solid #8ab4f8;
      outline-offset: 1px;
    }
    button.primary {
      background: #8ab4f8;
      color: #1f1f1f;
      font-weight: 650;
    }
    button.icon { width: 32px; padding: 0; font-size: 15px; }
    .omnibox {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: 34px;
      padding: 0 12px;
      border-radius: 17px;
      background: #1f2023;
      border: 1px solid rgba(255,255,255,.08);
    }
    .omnibox:focus-within {
      background: #fff;
      color: #202124;
      border-color: #8ab4f8;
    }
    .omnibox-icon {
      color: #9aa0a6;
      font-size: 13px;
    }
    .omnibox input {
      height: 30px;
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      outline: 0;
    }
    .menu-wrap { position: relative; }
    .menu-panel {
      position: absolute;
      top: 38px;
      right: 0;
      z-index: 20;
      width: min(340px, calc(100vw - 18px));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: #303134;
      box-shadow: 0 18px 50px rgba(0,0,0,.36);
      padding: 10px;
    }
    .menu-panel[hidden] { display: none; }
    .menu-title {
      margin: 2px 2px 8px;
      color: #dfe3ea;
      font-size: 12px;
      font-weight: 700;
    }
    .bookmark-form {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 7px;
    }
    .bookmark-form input {
      height: 32px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,.12);
      padding: 0 9px;
      background: #202124;
    }
    .bookmark-form input[name="bookmark-url"] { grid-column: 1 / -1; }
    .menu-separator {
      height: 1px;
      margin: 10px 0;
      background: rgba(255,255,255,.1);
    }
    .menu-action {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      border-radius: 7px;
    }
    .workspace {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }
    .frame-wrap {
      position: absolute;
      inset: 0;
      min-height: 0;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .new-tab {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: auto;
      padding: clamp(18px, 5vh, 42px) clamp(14px, 5vw, 58px) 32px;
      background:
        linear-gradient(180deg, rgba(138,180,248,.12), transparent 260px),
        #202124;
      color: #f1f3f4;
    }
    .workspace:not(.new-tab-open) .new-tab {
      display: none;
    }
    .new-tab-inner {
      width: min(940px, 100%);
      margin: 0 auto;
    }
    .new-tab h1 {
      margin: 0 0 18px;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }
    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(164px, 1fr));
      gap: 10px;
    }
    .site {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      min-height: 62px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 9px;
      background: rgba(255,255,255,.065);
      color: inherit;
      text-align: left;
    }
    .site:hover { background: rgba(255,255,255,.11); }
    .site-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      background: #3c4043;
      color: #e8eaed;
    }
    .site-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }
    .site-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #bdc1c6;
      font-size: 11px;
      margin-top: 2px;
    }
    .site-badge {
      display: inline-flex;
      width: fit-content;
      margin-top: 5px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(138,180,248,.16);
      color: #cfe1ff;
      font-size: 10px;
      font-weight: 650;
    }
    .site-menu-btn {
      width: 30px;
      min-width: 30px;
      height: 30px;
      border-radius: 50%;
      padding: 0;
      color: #d6d9df;
    }
    .external-panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 4;
      padding: 22px;
      background: #151821;
      color: #f5f7fb;
    }
    .external-panel[hidden] { display: none; }
    .external-card {
      width: min(500px, 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.24);
    }
    .external-card h1 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.25;
    }
    .external-card p {
      margin: 0 0 14px;
      color: #b8beca;
      font-size: 13px;
      line-height: 1.5;
    }
    .external-card .target {
      overflow-wrap: anywhere;
      margin-bottom: 14px;
      color: #d8e8ff;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .external-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    dialog {
      width: min(420px, calc(100vw - 24px));
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px;
      background: #303134;
      color: #f1f3f4;
      padding: 0;
      box-shadow: 0 22px 70px rgba(0,0,0,.42);
    }
    dialog::backdrop { background: rgba(0,0,0,.46); }
    .dialog-body { padding: 16px; }
    .dialog-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .dialog-url {
      margin-bottom: 14px;
      overflow-wrap: anywhere;
      color: #bdc1c6;
      font-size: 12px;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-btn {
      min-width: 0;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
    }
    .mode-btn.active {
      border-color: rgba(138,180,248,.85);
      background: rgba(138,180,248,.24);
      color: #e8f3ff;
    }
    .dialog-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
    }
    .delete-btn { color: #ffd7d7; }
    .status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 6;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(17,19,24,.88);
      color: #d7dbe4;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .16s, transform .16s;
      pointer-events: none;
    }
    .status.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 680px) {
      .tab-row { min-height: 34px; padding-inline: 6px; }
      .tab { width: clamp(112px, 40vw, 168px); height: 29px; }
      .toolbar {
        grid-template-columns: auto minmax(70px, 1fr) auto auto auto;
        gap: 5px;
        padding: 6px;
      }
      .toolbar .nav-group:first-child { gap: 3px; }
      .toolbar .nav-group:first-child button { width: 28px; min-width: 28px; }
      .omnibox { height: 32px; padding-inline: 10px; }
      .site-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .site {
        grid-template-columns: 34px minmax(0, 1fr) auto;
        min-height: 58px;
      }
      .site-icon { width: 34px; height: 34px; }
      .bookmark-form { grid-template-columns: 1fr; }
      .bookmark-form button { width: 100%; }
    }
    @media (max-width: 430px) {
      .site-grid { grid-template-columns: 1fr; }
      .external-actions { display: grid; }
      .external-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="chrome-shell">
    <div class="tab-row">
      <div class="tab-strip" id="tab-strip" role="tablist" aria-label="Browser tabs"></div>
      <button type="button" class="icon" id="new-tab-btn" title="New Tab" aria-label="New Tab">+</button>
    </div>
    <form class="toolbar" id="browser-form">
      <div class="nav-group">
        <button type="button" class="icon" id="back-btn" title="Back" aria-label="Back">&lt;</button>
        <button type="button" class="icon" id="forward-btn" title="Forward" aria-label="Forward">&gt;</button>
        <button type="button" class="icon" id="reload-btn" title="Reload" aria-label="Reload">R</button>
        <button type="button" class="icon" id="home-btn" title="Home" aria-label="Home">H</button>
      </div>
      <label class="omnibox">
        <span class="omnibox-icon" aria-hidden="true">Search</span>
        <input id="address-input" name="address" autocomplete="url" spellcheck="false" aria-label="Address or search">
      </label>
      <button type="button" class="icon" id="bookmark-btn" title="Bookmark current page" aria-label="Bookmark current page">S</button>
      <button type="button" class="icon" id="external-btn" title="Open in New Tab" aria-label="Open current page in browser tab">↗</button>
      <div class="menu-wrap">
        <button type="button" class="icon" id="menu-btn" title="Browser menu" aria-label="Browser menu" aria-expanded="false">...</button>
        <div class="menu-panel" id="menu-panel" hidden>
          <div class="menu-title">Add bookmark</div>
          <div class="bookmark-form">
            <input id="bookmark-title-input" name="bookmark-title" autocomplete="off" placeholder="Bookmark name" aria-label="Bookmark name">
            <input id="bookmark-icon-input" name="bookmark-icon" autocomplete="off" maxlength="2" placeholder="Icon" aria-label="Bookmark icon">
            <input id="bookmark-url-input" name="bookmark-url" autocomplete="url" placeholder="https://example.com" aria-label="Bookmark URL">
            <button type="button" class="primary" id="add-bookmark-btn" aria-label="Add bookmark">Add</button>
          </div>
          <div class="menu-separator"></div>
          <button type="button" class="menu-action" id="show-shortcuts-btn" aria-label="Show New Tab shortcuts">Show New Tab shortcuts</button>
          <button type="button" class="menu-action" id="copy-current-btn" aria-label="Copy current URL">Copy current URL</button>
        </div>
      </div>
    </form>
  </header>

  <main class="workspace" id="workspace">
    <section class="new-tab" id="new-tab" aria-label="New Tab shortcuts">
      <div class="new-tab-inner">
        <h1>New Tab</h1>
        <div class="site-grid" id="site-grid"></div>
      </div>
    </section>
    <div class="frame-wrap">
      <iframe id="browser-frame" credentialless referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-forms allow-popups allow-popups-to-escape-sandbox allow-scripts"></iframe>
      <div class="external-panel" id="external-panel" hidden>
        <div class="external-card">
          <h1 id="external-title">Open in a real browser tab</h1>
          <p id="external-message">This site is set to open outside the Web OS iframe.</p>
          <div class="target" id="external-target"></div>
          <div class="external-actions">
            <button type="button" class="primary" id="open-current-btn" aria-label="Open current site in a browser tab">Open in Tab</button>
            <button type="button" id="copy-external-btn" aria-label="Copy blocked site URL">Copy URL</button>
            <button type="button" id="back-new-tab-btn" aria-label="Back to New Tab">Back to New Tab</button>
          </div>
        </div>
      </div>
      <div class="status" id="status"></div>
    </div>
  </main>

  <dialog id="site-dialog">
    <div class="dialog-body">
      <h2 class="dialog-title" id="site-dialog-title">Bookmark settings</h2>
      <div class="dialog-url" id="site-dialog-url"></div>
      <div class="mode-grid">
        <button type="button" class="mode-btn" id="mode-embed-btn">Embed</button>
        <button type="button" class="mode-btn" id="mode-tab-btn">Tab</button>
      </div>
      <div class="dialog-actions">
        <button type="button" class="delete-btn" id="delete-site-btn">Delete</button>
        <button type="button" id="close-site-dialog-btn">Done</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    const MODE_STORAGE_KEY = 'vortex_browser_site_modes';
    const MODE_SCHEMA_KEY = 'vortex_browser_site_modes_schema';
    const MODE_SCHEMA_VERSION = '3';
    const CUSTOM_STORAGE_KEY = 'vortex_browser_custom_sites';
    const BASE_FRAME_SANDBOX = 'allow-forms allow-popups allow-popups-to-escape-sandbox allow-scripts';
    const SAME_ORIGIN_FRAME_SANDBOX = `${BASE_FRAME_SANDBOX} allow-same-origin`;
    const EMBED_SAME_ORIGIN_HOSTS = new Set([
      'yapweijun1996.com',
      'yapweijun1996.github.io'
    ]);
    const EXTERNAL_ONLY_HOSTS = new Set([
      'chatgpt.com',
      'github.com',
      'google.com',
      'openai.com',
      'vercel.com'
    ]);
    const DEFAULT_SITES = [
      { id: 'yapweijun', title: 'Yap Wei Jun', url: 'https://yapweijun1996.com/', icon: 'YW', defaultMode: 'embed' },
      { id: 'github-pages', title: 'GitHub Pages', url: 'https://yapweijun1996.github.io/Web-OS/', icon: 'GP', defaultMode: 'embed' },
      { id: 'github-profile', title: 'GitHub Profile', url: 'https://github.com/yapweijun1996', icon: 'GH', defaultMode: 'tab', externalOnly: true },
      { id: 'github', title: 'GitHub', url: 'https://github.com/', icon: 'GH', defaultMode: 'tab', externalOnly: true },
      { id: 'openai', title: 'OpenAI', url: 'https://openai.com/', icon: 'AI', defaultMode: 'tab', externalOnly: true },
      { id: 'chatgpt', title: 'ChatGPT', url: 'https://chatgpt.com/', icon: 'CG', defaultMode: 'tab', externalOnly: true },
      { id: 'mdn', title: 'MDN Web Docs', url: 'https://developer.mozilla.org/', icon: 'MD', defaultMode: 'embed' },
      { id: 'npm', title: 'npm', url: 'https://www.npmjs.com/', icon: 'np', defaultMode: 'embed' },
      { id: 'vercel', title: 'Vercel', url: 'https://vercel.com/', icon: 'VC', defaultMode: 'tab', externalOnly: true }
    ];

    const workspace = document.getElementById('workspace');
    const tabStrip = document.getElementById('tab-strip');
    const form = document.getElementById('browser-form');
    const input = document.getElementById('address-input');
    const frame = document.getElementById('browser-frame');
    const externalPanel = document.getElementById('external-panel');
    const externalTitle = document.getElementById('external-title');
    const externalMessage = document.getElementById('external-message');
    const externalTarget = document.getElementById('external-target');
    const siteGrid = document.getElementById('site-grid');
    const status = document.getElementById('status');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const homeBtn = document.getElementById('home-btn');
    const bookmarkBtn = document.getElementById('bookmark-btn');
    const externalBtn = document.getElementById('external-btn');
    const newTabBtn = document.getElementById('new-tab-btn');
    const menuBtn = document.getElementById('menu-btn');
    const menuPanel = document.getElementById('menu-panel');
    const bookmarkTitleInput = document.getElementById('bookmark-title-input');
    const bookmarkIconInput = document.getElementById('bookmark-icon-input');
    const bookmarkUrlInput = document.getElementById('bookmark-url-input');
    const addBookmarkBtn = document.getElementById('add-bookmark-btn');
    const showShortcutsBtn = document.getElementById('show-shortcuts-btn');
    const copyCurrentBtn = document.getElementById('copy-current-btn');
    const openCurrentBtn = document.getElementById('open-current-btn');
    const copyExternalBtn = document.getElementById('copy-external-btn');
    const backNewTabBtn = document.getElementById('back-new-tab-btn');
    const siteDialog = document.getElementById('site-dialog');
    const siteDialogTitle = document.getElementById('site-dialog-title');
    const siteDialogUrl = document.getElementById('site-dialog-url');
    const modeEmbedBtn = document.getElementById('mode-embed-btn');
    const modeTabBtn = document.getElementById('mode-tab-btn');
    const deleteSiteBtn = document.getElementById('delete-site-btn');
    const closeSiteDialogBtn = document.getElementById('close-site-dialog-btn');

    let siteModes = loadSiteModes();
    migrateSiteModes();
    let customSites = loadCustomSites();
    let tabs = [];
    let activeTabId = null;
    let selectedSite = null;
    let statusTimer = null;

    function loadSiteModes() {
      try {
        const value = JSON.parse(localStorage.getItem(MODE_STORAGE_KEY) || '{}');
        return value && typeof value === 'object' ? value : {};
      } catch {
        return {};
      }
    }

    function saveSiteModes() {
      localStorage.setItem(MODE_STORAGE_KEY, JSON.stringify(siteModes));
    }

    function migrateSiteModes() {
      if (localStorage.getItem(MODE_SCHEMA_KEY) === MODE_SCHEMA_VERSION) return;
      DEFAULT_SITES.forEach((site) => {
        if (site.externalOnly && site.defaultMode === 'tab' && siteModes[site.id] === 'embed') {
          delete siteModes[site.id];
        }
        if (embedKeepsOrigin(site.url) && site.defaultMode === 'embed' && siteModes[site.id] === 'tab') {
          delete siteModes[site.id];
        }
      });
      saveSiteModes();
      localStorage.setItem(MODE_SCHEMA_KEY, MODE_SCHEMA_VERSION);
    }

    function loadCustomSites() {
      try {
        const value = JSON.parse(localStorage.getItem(CUSTOM_STORAGE_KEY) || '[]');
        if (!Array.isArray(value)) return [];
        return value.filter((site) =>
          site &&
          typeof site.id === 'string' &&
          typeof site.title === 'string' &&
          typeof site.url === 'string'
        );
      } catch {
        return [];
      }
    }

    function saveCustomSites() {
      localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(customSites));
    }

    function allSites() {
      return [...DEFAULT_SITES, ...customSites];
    }

    function activeTab() {
      return tabs.find((tab) => tab.id === activeTabId);
    }

    function createTab({ url = '', title = 'New Tab', mode = 'embed', activate = true, navigateNow = false } = {}) {
      const tab = {
        id: `tab-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        url,
        mode,
        isNewTab: !url,
        loading: false,
        external: false,
        blocked: false,
        history: url ? [{ url, mode }] : [],
        historyIndex: url ? 0 : -1
      };
      tabs = [...tabs, tab];
      if (activate) activeTabId = tab.id;
      render();
      if (navigateNow && url) navigate(url, { mode, push: false });
      return tab;
    }

    function closeTab(tabId) {
      if (tabs.length === 1) {
        createTab();
      }
      const index = tabs.findIndex((tab) => tab.id === tabId);
      tabs = tabs.filter((tab) => tab.id !== tabId);
      if (activeTabId === tabId) {
        activeTabId = tabs[Math.max(0, index - 1)]?.id || tabs[0]?.id;
      }
      render();
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      render();
    }

    function siteMode(site) {
      const saved = siteModes[site.id];
      if (saved === 'embed' || saved === 'tab') return saved;
      return site.defaultMode || (site.externalOnly ? 'tab' : 'embed');
    }

    function setSiteMode(site, mode) {
      siteModes = { ...siteModes, [site.id]: mode };
      saveSiteModes();
      renderSiteDialog(site);
      renderShortcuts();
      setStatus(`${site.title} opens in ${mode === 'tab' ? 'a browser tab' : 'the Web OS window'}`);
    }

    function addCustomSite({ title, url, icon }) {
      const cleanTitle = title.trim();
      const target = normalizeTarget(url);
      if (!cleanTitle || !target) {
        setStatus('Bookmark name and URL are required');
        return null;
      }
      const next = {
        id: `custom-${Date.now()}`,
        title: cleanTitle,
        url: target,
        icon: (icon.trim() || cleanTitle.slice(0, 2) || 'ST').slice(0, 2),
        defaultMode: externalOnly(target) ? 'tab' : 'embed',
        custom: true
      };
      customSites = [...customSites, next];
      saveCustomSites();
      renderShortcuts();
      setStatus(`Added bookmark: ${next.title}`);
      return next;
    }

    function deleteCustomSite(site) {
      customSites = customSites.filter((item) => item.id !== site.id);
      delete siteModes[site.id];
      saveCustomSites();
      saveSiteModes();
      if (siteDialog.open) siteDialog.close();
      renderShortcuts();
      setStatus(`Removed bookmark: ${site.title}`);
    }

    function normalizeTarget(value) {
      const raw = value.trim();
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      if (/^[a-z0-9.-]+\.[a-z]{2,}([/:?#].*)?$/i.test(raw)) return `https://${raw}`;
      return `https://www.google.com/search?q=${encodeURIComponent(raw)}`;
    }

    function hostname(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, '');
      } catch {
        return '';
      }
    }

    function externalOnly(url) {
      return EXTERNAL_ONLY_HOSTS.has(hostname(url));
    }

    function embedKeepsOrigin(url) {
      return EMBED_SAME_ORIGIN_HOSTS.has(hostname(url));
    }

    function setFrameSandbox(url) {
      frame.setAttribute('sandbox', embedKeepsOrigin(url) ? SAME_ORIGIN_FRAME_SANDBOX : BASE_FRAME_SANDBOX);
    }

    function setStatus(message) {
      status.textContent = message;
      status.classList.add('visible');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove('visible'), 3200);
    }

    function titleFromUrl(url) {
      return hostname(url) || 'New Tab';
    }

    function openExternal(url) {
      if (!url) return;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    async function copyText(value) {
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
        setStatus('Copied URL');
      } catch {
        setStatus(value);
      }
    }

    function showMenu(open) {
      menuPanel.hidden = !open;
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) {
        const tab = activeTab();
        bookmarkUrlInput.value = tab?.url || '';
        bookmarkTitleInput.value = tab?.url ? titleFromUrl(tab.url) : '';
      }
    }

    function showNewTab() {
      const tab = activeTab();
      if (!tab) return;
      tab.isNewTab = true;
      tab.url = '';
      tab.title = 'New Tab';
      tab.loading = false;
      tab.external = false;
      tab.blocked = false;
      tab.mode = 'embed';
      frame.removeAttribute('src');
      externalPanel.hidden = true;
      input.value = '';
      render();
      setStatus('New Tab');
    }

    function navigate(url, { mode = 'embed', push = true, openBlocked = false } = {}) {
      const tab = activeTab() || createTab();
      const target = normalizeTarget(url);
      if (!target) {
        showNewTab();
        return;
      }
      const resolvedMode = externalOnly(target) ? 'tab' : mode;
      tab.url = target;
      tab.title = titleFromUrl(target);
      tab.mode = resolvedMode;
      tab.isNewTab = false;
      tab.loading = resolvedMode !== 'tab';
      tab.external = resolvedMode === 'tab';
      tab.blocked = mode === 'embed' && externalOnly(target);
      if (push) {
        tab.history.splice(tab.historyIndex + 1);
        tab.history.push({ url: target, mode: resolvedMode });
        tab.historyIndex = tab.history.length - 1;
      }
      input.value = target;
      workspace.classList.remove('new-tab-open');
      renderTabs();
      setNavState();
      if (tab.external || tab.blocked) {
        showExternalPanel(target, { open: openBlocked, blocked: tab.blocked });
        return;
      }
      externalPanel.hidden = true;
      setFrameSandbox(target);
      frame.src = target;
      setStatus(`Loading ${hostname(target)}`);
    }

    function navigateSite(site, { openBlocked = true } = {}) {
      navigate(site.url, { mode: siteMode(site), openBlocked });
    }

    function showExternalPanel(url, { open = false, blocked = false } = {}) {
      const tab = activeTab();
      if (tab) {
        tab.loading = false;
        tab.external = true;
        tab.blocked = blocked;
      }
      externalTitle.textContent = blocked ? 'Embedding blocked by this website' : 'Open in a real browser tab';
      externalMessage.textContent = blocked
        ? 'This site blocks iframe embedding through browser security headers. Use a normal tab for the full site.'
        : 'This page is set to open outside the Web OS iframe for the full site.';
      externalTarget.textContent = url;
      externalPanel.hidden = false;
      frame.removeAttribute('src');
      if (open) openExternal(url);
      renderTabs();
      setStatus(open ? 'Opened in a browser tab' : 'Open this site in a browser tab');
    }

    function renderTabs() {
      tabStrip.replaceChildren();
      tabs.forEach((tab) => {
        const button = document.createElement('div');
        button.className = `tab${tab.id === activeTabId ? ' active' : ''}`;
        button.setAttribute('role', 'tab');
        button.tabIndex = 0;
        button.setAttribute('aria-selected', tab.id === activeTabId ? 'true' : 'false');
        button.setAttribute('aria-label', `Switch to ${tab.title}`);
        button.addEventListener('click', () => switchTab(tab.id));
        button.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            switchTab(tab.id);
          }
        });

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = tab.loading ? `${tab.title}...` : tab.title;

        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'tab-close';
        close.textContent = 'x';
        close.setAttribute('aria-label', `Close ${tab.title}`);
        close.addEventListener('click', (event) => {
          event.stopPropagation();
          closeTab(tab.id);
        });

        button.append(title, close);
        tabStrip.appendChild(button);
      });
    }

    function setNavState() {
      const tab = activeTab();
      const hasHistory = Boolean(tab);
      backBtn.disabled = !hasHistory || tab.historyIndex <= 0;
      forwardBtn.disabled = !hasHistory || tab.historyIndex >= tab.history.length - 1;
      reloadBtn.disabled = !hasHistory || tab.isNewTab;
      externalBtn.disabled = !hasHistory || tab.isNewTab || !tab.url;
      bookmarkBtn.disabled = !hasHistory || tab.isNewTab || !tab.url;
      bookmarkBtn.textContent = isCurrentBookmarked() ? '*' : 'S';
      bookmarkBtn.setAttribute('aria-label', isCurrentBookmarked() ? 'Remove current page bookmark' : 'Bookmark current page');
    }

    function isCurrentBookmarked() {
      const tab = activeTab();
      if (!tab?.url) return false;
      return customSites.some((site) => site.url === tab.url);
    }

    function toggleCurrentBookmark() {
      const tab = activeTab();
      if (!tab?.url) return;
      const existing = customSites.find((site) => site.url === tab.url);
      if (existing) {
        deleteCustomSite(existing);
        return;
      }
      addCustomSite({
        title: tab.title || titleFromUrl(tab.url),
        url: tab.url,
        icon: (hostname(tab.url).slice(0, 2) || 'ST').toUpperCase()
      });
      setNavState();
    }

    function renderShortcuts() {
      siteGrid.replaceChildren();
      allSites().forEach((site) => {
        const mode = siteMode(site);
        const item = document.createElement('div');
        item.className = 'site';
        item.title = site.url;
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `Open ${site.title}`);
        item.addEventListener('click', () => navigateSite(site));
        item.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            navigateSite(site);
          }
        });

        const icon = document.createElement('div');
        icon.className = 'site-icon';
        icon.textContent = site.icon;

        const copy = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'site-title';
        title.textContent = site.title;
        const url = document.createElement('div');
        url.className = 'site-url';
        url.textContent = site.url.replace(/^https?:\/\//, '');
        copy.append(title, url);
        if (mode === 'tab') {
          const badge = document.createElement('div');
          badge.className = 'site-badge';
          badge.textContent = 'NEW TAB';
          copy.appendChild(badge);
        }

        const menu = document.createElement('button');
        menu.type = 'button';
        menu.className = 'site-menu-btn';
        menu.textContent = '...';
        menu.setAttribute('aria-label', `Edit ${site.title} bookmark settings`);
        menu.addEventListener('click', (event) => {
          event.stopPropagation();
          openSiteDialog(site);
        });

        item.append(icon, copy, menu);
        siteGrid.appendChild(item);
      });
    }

    function openSiteDialog(site) {
      selectedSite = site;
      renderSiteDialog(site);
      siteDialog.showModal();
    }

    function renderSiteDialog(site) {
      if (!site) return;
      const mode = siteMode(site);
      siteDialogTitle.textContent = `${site.title} settings`;
      siteDialogUrl.textContent = site.url;
      modeEmbedBtn.className = `mode-btn${mode === 'embed' ? ' active' : ''}`;
      modeTabBtn.className = `mode-btn${mode === 'tab' ? ' active' : ''}`;
      modeEmbedBtn.setAttribute('aria-label', `Set ${site.title} to Embed`);
      modeTabBtn.setAttribute('aria-label', `Set ${site.title} to Tab`);
      modeEmbedBtn.setAttribute('aria-pressed', mode === 'embed' ? 'true' : 'false');
      modeTabBtn.setAttribute('aria-pressed', mode === 'tab' ? 'true' : 'false');
      deleteSiteBtn.hidden = !site.custom;
    }

    function render() {
      const tab = activeTab();
      renderTabs();
      renderShortcuts();
      setNavState();
      showMenu(false);
      if (!tab || tab.isNewTab) {
        workspace.classList.add('new-tab-open');
        frame.removeAttribute('src');
        externalPanel.hidden = true;
        input.value = '';
        return;
      }
      workspace.classList.remove('new-tab-open');
      input.value = tab.url;
      if (tab.external || tab.blocked) {
        showExternalPanel(tab.url, { blocked: tab.blocked });
        return;
      }
      externalPanel.hidden = true;
      setFrameSandbox(tab.url);
      frame.src = tab.url;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      navigate(input.value, { mode: externalOnly(normalizeTarget(input.value)) ? 'tab' : 'embed', openBlocked: true });
    });

    backBtn.addEventListener('click', () => {
      const tab = activeTab();
      if (!tab || tab.historyIndex <= 0) return;
      tab.historyIndex -= 1;
      const entry = tab.history[tab.historyIndex];
      navigate(entry.url, { mode: entry.mode, push: false });
    });

    forwardBtn.addEventListener('click', () => {
      const tab = activeTab();
      if (!tab || tab.historyIndex >= tab.history.length - 1) return;
      tab.historyIndex += 1;
      const entry = tab.history[tab.historyIndex];
      navigate(entry.url, { mode: entry.mode, push: false });
    });

    reloadBtn.addEventListener('click', () => {
      const tab = activeTab();
      if (!tab?.url) return;
      if (tab.external || tab.blocked) {
        openExternal(tab.url);
        return;
      }
      try {
        frame.contentWindow.location.reload();
      } catch {
        frame.src = frame.src;
      }
      tab.loading = true;
      renderTabs();
      setStatus('Reloading page');
    });

    homeBtn.addEventListener('click', () => navigateSite(DEFAULT_SITES[0], { openBlocked: false }));
    newTabBtn.addEventListener('click', () => createTab());
    bookmarkBtn.addEventListener('click', toggleCurrentBookmark);
    externalBtn.addEventListener('click', () => openExternal(activeTab()?.url || normalizeTarget(input.value)));
    menuBtn.addEventListener('click', () => showMenu(menuPanel.hidden));
    showShortcutsBtn.addEventListener('click', () => {
      showMenu(false);
      showNewTab();
    });
    copyCurrentBtn.addEventListener('click', () => copyText(activeTab()?.url || normalizeTarget(input.value)));
    addBookmarkBtn.addEventListener('click', () => {
      const site = addCustomSite({
        title: bookmarkTitleInput.value,
        url: bookmarkUrlInput.value,
        icon: bookmarkIconInput.value
      });
      if (site) {
        bookmarkTitleInput.value = '';
        bookmarkUrlInput.value = '';
        bookmarkIconInput.value = '';
      }
    });
    openCurrentBtn.addEventListener('click', () => openExternal(activeTab()?.url || externalTarget.textContent));
    copyExternalBtn.addEventListener('click', () => copyText(activeTab()?.url || externalTarget.textContent));
    backNewTabBtn.addEventListener('click', showNewTab);
    modeEmbedBtn.addEventListener('click', () => selectedSite && setSiteMode(selectedSite, 'embed'));
    modeTabBtn.addEventListener('click', () => selectedSite && setSiteMode(selectedSite, 'tab'));
    deleteSiteBtn.addEventListener('click', () => selectedSite && deleteCustomSite(selectedSite));
    closeSiteDialogBtn.addEventListener('click', () => siteDialog.close());

    frame.addEventListener('load', () => {
      const tab = activeTab();
      if (!tab) return;
      tab.loading = false;
      renderTabs();
      setStatus('Page loaded');
    });

    document.addEventListener('click', (event) => {
      if (!menuPanel.hidden && !menuPanel.contains(event.target) && event.target !== menuBtn) {
        showMenu(false);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        showMenu(false);
      }
    });

    renderShortcuts();
    createTab({ url: DEFAULT_SITES[0].url, title: DEFAULT_SITES[0].title, mode: siteMode(DEFAULT_SITES[0]), navigateNow: true });
  </script>
</body>
</html>
