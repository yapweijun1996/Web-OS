<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #18181b; color: #f4f4f5; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      padding: 18px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    .timestamp { color: #a1a1aa; font-size: 12px; font-variant-numeric: tabular-nums; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .card {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      background: rgba(255,255,255,.055);
      padding: 12px;
      min-height: 86px;
    }
    .label { color: #a1a1aa; font-size: 12px; margin-bottom: 8px; }
    .value { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ok { color: #86efac; }
    .warn { color: #fde68a; }
    .bad { color: #fca5a5; }
    .panel {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(150px, .8fr) 1fr;
      gap: 12px;
      padding: 9px 12px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
    }
    .row:first-child { border-top: 0; }
    .key { color: #a1a1aa; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button {
      border: 0;
      border-radius: 7px;
      background: #0a84ff;
      color: #fff;
      padding: 7px 11px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button.secondary { background: rgba(255,255,255,.14); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>System Dashboard</h1>
    <div class="timestamp" id="timestamp"></div>
  </div>

  <section class="grid" aria-label="System status">
    <div class="card">
      <div class="label">IndexedDB</div>
      <div class="value" id="idb-status">Checking</div>
    </div>
    <div class="card">
      <div class="label">Compression Streams</div>
      <div class="value" id="compression-status">Checking</div>
    </div>
    <div class="card">
      <div class="label">Installed plugins</div>
      <div class="value" id="plugin-count">0</div>
    </div>
    <div class="card">
      <div class="label">KB-MCP config</div>
      <div class="value" id="kb-status">Checking</div>
    </div>
  </section>

  <section class="panel" aria-label="Runtime details">
    <div class="row"><div class="key">Location</div><div id="app-location"></div></div>
    <div class="row"><div class="key">User agent</div><div id="user-agent"></div></div>
    <div class="row"><div class="key">Viewport</div><div id="viewport"></div></div>
    <div class="row"><div class="key">Storage estimate</div><div id="storage-estimate"></div></div>
  </section>

  <div class="actions">
    <button type="button" id="refresh-btn">Refresh</button>
    <button type="button" class="secondary" id="clear-kb-btn">Clear KB Config</button>
  </div>

  <script type="module">
    const els = {
      timestamp: document.getElementById('timestamp'),
      idb: document.getElementById('idb-status'),
      compression: document.getElementById('compression-status'),
      plugins: document.getElementById('plugin-count'),
      kb: document.getElementById('kb-status'),
      location: document.getElementById('app-location'),
      userAgent: document.getElementById('user-agent'),
      viewport: document.getElementById('viewport'),
      storage: document.getElementById('storage-estimate')
    };

    function setStatus(el, text, className) {
      el.textContent = text;
      el.className = `value ${className}`;
    }

    async function refresh() {
      els.timestamp.textContent = new Date().toLocaleString();
      setStatus(els.idb, 'indexedDB' in window ? 'Ready' : 'Missing', 'indexedDB' in window ? 'ok' : 'bad');
      setStatus(
        els.compression,
        'CompressionStream' in window && 'DecompressionStream' in window ? 'Ready' : 'Missing',
        'CompressionStream' in window && 'DecompressionStream' in window ? 'ok' : 'bad'
      );

      let plugins = [];
      try {
        plugins = JSON.parse(localStorage.getItem('vortex_installed_apps') || '[]');
      } catch {
        plugins = [];
      }
      els.plugins.textContent = String(Array.isArray(plugins) ? plugins.length : 0);

      const hasKbId = !!localStorage.getItem('vortex_kb_id');
      const hasKbKey = !!localStorage.getItem('vortex_kb_api_key');
      setStatus(els.kb, hasKbId && hasKbKey ? 'Configured' : 'Missing', hasKbId && hasKbKey ? 'ok' : 'warn');

      els.location.textContent = location.origin;
      els.userAgent.textContent = navigator.userAgent;
      els.viewport.textContent = `${window.innerWidth} x ${window.innerHeight}`;

      if (navigator.storage && navigator.storage.estimate) {
        const estimate = await navigator.storage.estimate();
        const used = Math.round((estimate.usage || 0) / 1024);
        const quota = Math.round((estimate.quota || 0) / 1024 / 1024);
        els.storage.textContent = `${used} KB used of ${quota} MB quota`;
      } else {
        els.storage.textContent = 'Unavailable';
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', refresh);
    document.getElementById('clear-kb-btn').addEventListener('click', () => {
      localStorage.removeItem('vortex_kb_id');
      localStorage.removeItem('vortex_kb_api_key');
      refresh();
    });
    window.addEventListener('resize', refresh);
    refresh();
  </script>
</body>
</html>
