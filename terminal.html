<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e2e; }
    #term {
      height: 100%;
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="term"></div>

  <!--
    VORTEX-106: Terminal plugin.
    A real xterm.js terminal emulator wired to the v86 WebAssembly Linux VM
    through V86LinuxBridge. The terminal UI and the bridge communicate over a
    MessageChannel: keystrokes travel out as STDIN, serial output comes back
    as STDOUT. When the v86 binaries are absent the bridge reports a BOOT_ERROR
    which is rendered inline, so the terminal degrades gracefully.
  -->
  <script type="module">
    import { Terminal } from '@xterm/xterm';
    import { FitAddon } from '@xterm/addon-fit';
    import '@xterm/xterm/css/xterm.css';
    import { V86LinuxBridge } from './v86-bridge.js';

    // --- Terminal emulator UI ---
    const term = new Terminal({
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      fontSize: 13,
      cursorBlink: true,
      convertEol: true,
      theme: { background: '#1e1e2e', foreground: '#cdd6f4', cursor: '#cba6f7' }
    });
    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('term'));
    fitAddon.fit();
    window.addEventListener('resize', () => fitAddon.fit());

    term.writeln('Vortex OS Terminal — v86 WebAssembly Linux bridge');
    term.writeln('Booting Linux VM worker...');
    term.writeln('');

    // --- Wire the terminal to V86LinuxBridge over a MessageChannel ---
    // The bridge owns port1 (listens for STDIN, emits STDOUT); the terminal
    // owns port2 (emits STDIN, renders STDOUT).
    const bridge = new V86LinuxBridge();
    const channel = new MessageChannel();

    // Register the terminal port BEFORE init() so an early BOOT_ERROR broadcast
    // still reaches this terminal.
    bridge.registerTerminalPort('terminal-main', channel.port1);

    channel.port2.onmessage = (event) => {
      if (event.data && event.data.action === 'STDOUT') {
        term.write(event.data.data);
      }
    };

    // Keystrokes -> STDIN -> bridge -> worker -> v86 serial port.
    term.onData((data) => {
      channel.port2.postMessage({ action: 'STDIN', data });
    });

    bridge.init();
  </script>
</body>
</html>
