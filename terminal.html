<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Cross-origin isolation shim so WebContainer works when this page is
       opened standalone, not just as an iframe inside the COI host. -->
  <script type="module">
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      import('./coi-loader.js');
    }
  </script>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Terminal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e2e; }
    #term {
      height: 100%;
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="term"></div>

  <!--
    VORTEX-106: Terminal plugin.
    A real xterm.js terminal emulator with a built-in Vortex shell. The optional
    v86 Linux bridge is started only when the user asks for it, so missing VM
    binaries no longer leave the terminal unusable.
  -->
  <script type="module">
    const PYODIDE_MODULE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.mjs';
    const PYODIDE_INDEX_URL = 'https://cdn.jsdelivr.net/pyodide/v0.29.4/full/';
    const NPM_GLOBAL_PREFIX = '/home/.npm-global';
    const NPM_CACHE_DIR = '/home/.npm';
    const APP_BASE = import.meta.env?.BASE_URL || './';
    const V86_BASE = APP_BASE + 'v86/';
    const LINUX_PROFILES = {
      buildroot: {
        name: 'Buildroot',
        resources: [`${V86_BASE}libv86.js`, `${V86_BASE}buildroot-bzimage68.bin`],
        config: {
          libUrl: `${V86_BASE}libv86.js`,
          bzimageUrl: `${V86_BASE}buildroot-bzimage68.bin`,
          cmdline: 'console=ttyS0 earlyprintk=serial,ttyS0 root=/dev/ram0 rw',
          memorySize: 128 * 1024 * 1024
        },
        readyPatterns: ['~%'],
        readyMessage: [
          '[Vortex OS] Linux shell ready. This Buildroot image has sh, but no bash/apk/node/python3 and no HTTPS curl.',
          '[Vortex OS] Try: uname -a, ip addr, ifconfig, udhcpc. Use Vortex shell WebContainer for npm.'
        ]
      },
      alpine: {
        name: 'Alpine',
        resources: [`${V86_BASE}libv86.js`, `${V86_BASE}buildroot-bzimage68.bin`, `${V86_BASE}alpine-initramfs.cpio.gz`],
        config: {
          libUrl: `${V86_BASE}libv86.js`,
          bzimageUrl: `${V86_BASE}buildroot-bzimage68.bin`,
          initrdUrl: `${V86_BASE}alpine-initramfs.cpio.gz`,
          networkRelayUrl: 'fetch',
          netDevice: {
            type: 'ne2k',
            relay_url: 'fetch',
            dns_method: 'static'
          },
          cmdline: 'console=ttyS0 earlyprintk=serial,ttyS0 root=/dev/ram0 rw init=/init',
          memorySize: 192 * 1024 * 1024
        },
        readyPatterns: ['[Vortex OS] Alpine Linux initramfs ready.', '/ #', '~ #'],
        readyMessage: [
          '[Vortex OS] Alpine shell ready. bash, curl, CA certificates, and apk are available.',
          '[Vortex OS] v86 fetch relay handles DHCP/DNS/HTTP. The same-origin APK mirror is configured from the current dev port.'
        ]
      }
    };
    let loadPyodideModule = null;
    let WebContainerRuntime = null;
    let V86LinuxBridgeRuntime = null;
    let terminalRuntimeMode = 'full';

    class BasicTerminal {
      constructor() {
        this.cols = 80;
        this.rows = 24;
        this._onData = null;
        this._screen = null;
        this._buffer = '';
      }

      loadAddon() {}

      open(element) {
        this._screen = document.createElement('pre');
        this._screen.tabIndex = 0;
        this._screen.setAttribute('role', 'textbox');
        this._screen.setAttribute('aria-label', 'Terminal input');
        this._screen.style.margin = '0';
        this._screen.style.height = '100%';
        this._screen.style.overflow = 'auto';
        this._screen.style.whiteSpace = 'pre-wrap';
        this._screen.style.outline = 'none';
        this._screen.style.font = '13px Menlo, Monaco, "Courier New", monospace';
        this._screen.style.color = '#cdd6f4';
        this._screen.style.background = '#1e1e2e';
        element.replaceChildren(this._screen);
        this._screen.addEventListener('keydown', (event) => this._handleKey(event));
        this._screen.focus();
      }

      onData(callback) {
        this._onData = callback;
      }

      write(value = '') {
        for (const char of String(value).replace(/\r/g, '')) {
          if (char === '\b') this._buffer = this._buffer.slice(0, -1);
          else this._buffer += char;
        }
        this._render();
      }

      writeln(value = '') {
        this.write(`${value}\n`);
      }

      clear() {
        this._buffer = '';
        this._render();
      }

      _render() {
        if (!this._screen) return;
        this._screen.textContent = this._buffer;
        this._screen.scrollTop = this._screen.scrollHeight;
      }

      _handleKey(event) {
        if (!this._onData) return;
        if (event.key === 'Enter') {
          event.preventDefault();
          this._onData('\r');
        } else if (event.key === 'Backspace') {
          event.preventDefault();
          this._onData('\u007f');
        } else if (event.key === 'c' && event.ctrlKey) {
          event.preventDefault();
          this._onData('\u0003');
        } else if (event.key.length === 1 && !event.metaKey && !event.ctrlKey) {
          event.preventDefault();
          this._onData(event.key);
        }
      }
    }

    class LocalStorageEngine {
      constructor() {
        this.key = 'vortex_terminal_direct_files';
      }

      async init() {}

      _readAll() {
        try {
          return JSON.parse(localStorage.getItem(this.key) || '{}');
        } catch {
          return {};
        }
      }

      _writeAll(value) {
        localStorage.setItem(this.key, JSON.stringify(value));
      }

      async listFiles(path = '/') {
        const prefix = path === '/' ? '/' : path.replace(/\/$/, '') + '/';
        return Object.keys(this._readAll()).filter((file) => file === path || file.startsWith(prefix));
      }

      async appendToGzFile(path, line) {
        const files = this._readAll();
        const current = files[path] ? `${files[path]}\n` : '';
        files[path] = `${current}${line}`;
        this._writeAll(files);
      }

      async readGzFileLines(path) {
        const value = this._readAll()[path];
        if (!value) return [];
        return value.split('\n').filter(Boolean).map((line) => {
          try {
            return JSON.parse(line);
          } catch {
            return line;
          }
        });
      }
    }

    async function loadTerminalRuntime() {
      if (location.protocol === 'file:') {
        terminalRuntimeMode = 'direct-file';
        return {
          Terminal: BasicTerminal,
          FitAddon: class { fit() {} },
          StorageEngine: LocalStorageEngine
        };
      }
      try {
        const [{ Terminal }, { FitAddon }, { WebContainer }, { CompressedStorageEngine }, { V86LinuxBridge }] = await Promise.all([
          import('@xterm/xterm'),
          import('@xterm/addon-fit'),
          import('@webcontainer/api'),
          import('./jsonl-storage-engine.js'),
          import('./v86-bridge.js')
        ]);
        try {
          await import('@xterm/xterm/css/xterm.css');
        } catch {
          // CSS import is a Vite convenience. The terminal remains usable without it.
        }
        WebContainerRuntime = WebContainer;
        V86LinuxBridgeRuntime = V86LinuxBridge;
        return { Terminal, FitAddon, StorageEngine: CompressedStorageEngine };
      } catch (err) {
        terminalRuntimeMode = 'direct-file';
        console.warn('[Terminal] Full runtime unavailable; using direct-file fallback.', err);
        return {
          Terminal: BasicTerminal,
          FitAddon: class { fit() {} },
          StorageEngine: LocalStorageEngine
        };
      }
    }

    async function main() {
      const { Terminal, FitAddon, StorageEngine } = await loadTerminalRuntime();
      // --- Terminal emulator UI ---
      const term = new Terminal({
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        fontSize: 13,
        cursorBlink: true,
        convertEol: true,
        theme: { background: '#1e1e2e', foreground: '#cdd6f4', cursor: '#cba6f7' }
      });
      const fitAddon = new FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('term'));
      fitAddon.fit();
      window.addEventListener('resize', () => {
        fitAddon.fit();
        if (runningProcess?.resize) {
          runningProcess.resize({ cols: term.cols, rows: term.rows });
        }
      });

      const storage = new StorageEngine();
      await storage.init();

      let mode = 'shell';
      let cwd = '/';
      let input = '';
      let bridge = null;
      let linuxPort = null;
      let webcontainer = null;
      let pyodide = null;
      let runningProcess = null;
      let processInput = null;
      const runtimeFiles = new Map();
      const prompt = () => `vortex:${cwd} $ `;

      term.writeln('Vortex OS Terminal');
      term.writeln('Quick start:');
      term.writeln('  py print("hello")          # run Python inline');
      term.writeln('  js console.log("hello")    # run Node.js inline');
      term.writeln('  write hi.py "print(42)"    # save file, then: python hi.py');
      term.writeln('  write hi.js "console.log(42)"   # save file, then: node hi.js');
      term.writeln('Type "help" for all commands.');
      if (terminalRuntimeMode === 'direct-file') {
        term.writeln('');
        term.writeln('[Fallback] Running without Vite/WebContainer. Basic shell, VFS, Python, and browser JS are available.');
        term.writeln('[Fallback] Node/npm/v86 need HTTP serving: npm run dev or npm run preview.');
      }
      if (terminalRuntimeMode === 'full' && !window.crossOriginIsolated) {
        term.writeln('');
        term.writeln('[Notice] First load: the page will reload once automatically to enable WebContainer.');
        term.writeln('[Notice] Node/npm will be available after the reload — this only happens once per browser.');
      }
      term.writeln('');
      writePrompt();

      function writePrompt() {
        term.write(prompt());
      }

      function parseArgs(line) {
        const args = [];
        const re = /"([^"]*)"|'([^']*)'|(\S+)/g;
        let match;
        while ((match = re.exec(line))) {
          args.push(match[1] ?? match[2] ?? match[3]);
        }
        return args;
      }

      function resolvePath(path = cwd) {
        if (!path || path === '.') return cwd;
        const raw = path.startsWith('/') ? path : `${cwd.replace(/\/$/, '')}/${path}`;
        const parts = [];
        for (const part of raw.split('/')) {
          if (!part || part === '.') continue;
          if (part === '..') parts.pop();
          else parts.push(part);
        }
        return '/' + parts.join('/');
      }

      function normalizeRuntimePath(path) {
        return resolvePath(path).replace(/^\/+/, '') || 'index.js';
      }

      function dirname(path) {
        const i = path.lastIndexOf('/');
        return i === -1 ? '' : path.slice(0, i);
      }

      async function pathExists(path) {
        const files = await storage.listFiles(path);
        return files.includes(path) || files.some((file) => file.startsWith(path.replace(/\/$/, '') + '/'));
      }

      async function getWebContainer() {
        if (webcontainer) return webcontainer;
        if (!WebContainerRuntime) {
          term.writeln('Node/npm are unavailable in direct-file fallback mode.');
          term.writeln('Run the project through HTTP for full Terminal support: npm run dev -- --host 127.0.0.1');
          throw new Error('WebContainer runtime unavailable.');
        }
        if (!window.crossOriginIsolated) {
          term.writeln('[Vortex] Cross-origin isolation is not yet active.');
          term.writeln('[Vortex] The page will reload automatically once the service worker activates — please wait a moment.');
          throw new Error('Not cross-origin isolated. Page will reload automatically.');
        }
        term.writeln('Booting WebContainer Node.js runtime...');
        webcontainer = await WebContainerRuntime.boot({ coep: 'credentialless', workdirName: 'vortex' });
        await webcontainer.mount({
          'package.json': {
            file: {
              contents: JSON.stringify({
                type: 'module',
                scripts: { start: 'node index.js' },
                dependencies: {}
              }, null, 2)
            }
          },
          'index.js': {
            file: { contents: 'console.log("Hello from Vortex OS Node.js", process.version);\n' }
          }
        });
        runtimeFiles.set('index.js', 'console.log("Hello from Vortex OS Node.js", process.version);\n');
        term.writeln('Node.js runtime ready.');
        return webcontainer;
      }

      async function ensureNpmWritableGlobalPrefix(wc) {
        await wc.fs.mkdir(`${NPM_GLOBAL_PREFIX}/bin`, { recursive: true });
        await wc.fs.mkdir(NPM_CACHE_DIR, { recursive: true });
      }

      function hasGlobalNpmFlag(args) {
        return args.includes('-g') || args.includes('--global');
      }

      function hasNpmPrefixArg(args) {
        return args.includes('--prefix') || args.some((arg) => arg.startsWith('--prefix='));
      }

      function normalizeWebContainerCommand(command, args) {
        if (command !== 'npm' || !hasGlobalNpmFlag(args) || hasNpmPrefixArg(args)) {
          return { args, usedWritablePrefix: false };
        }
        return {
          args: [...args, '--prefix', NPM_GLOBAL_PREFIX],
          usedWritablePrefix: true
        };
      }

      function isSafeExecutableName(command) {
        return /^[a-zA-Z0-9._-]+$/.test(command);
      }

      async function getInstalledGlobalBin(command) {
        if (!webcontainer || !isSafeExecutableName(command)) return '';
        const binPath = `${NPM_GLOBAL_PREFIX}/bin/${command}`;
        try {
          const entries = await webcontainer.fs.readdir(`${NPM_GLOBAL_PREFIX}/bin`);
          if (entries.some((entry) => (typeof entry === 'string' ? entry : entry.name) === command)) {
            return binPath;
          }
          await webcontainer.fs.stat(binPath);
          return binPath;
        } catch {
          return '';
        }
      }

      async function runGlobalWebContainerCommand(command, args) {
        if (!webcontainer || !isSafeExecutableName(command)) return false;
        const candidates = [`${NPM_GLOBAL_PREFIX}/bin/${command}`, command];
        for (const candidate of candidates) {
          try {
            await runWebContainerCommand(candidate, args);
            return true;
          } catch {
            // Try the next candidate before falling back to shell-level not found.
          }
        }
        return false;
      }

      async function readGlobalPackageJson(packageName) {
        if (!webcontainer) return null;
        try {
          const raw = await webcontainer.fs.readFile(`${NPM_GLOBAL_PREFIX}/lib/node_modules/${packageName}/package.json`, 'utf-8');
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      async function runCodexCommand(args) {
        const pkg = await readGlobalPackageJson('@openai/codex');
        if (args.includes('--version') || args.includes('-V')) {
          if (pkg?.version) {
            term.writeln(`@openai/codex ${pkg.version}`);
          } else {
            term.writeln('@openai/codex is not installed in this WebContainer session.');
          }
        }
        term.writeln('Codex CLI cannot run inside browser WebContainer.');
        term.writeln('Current @openai/codex launches a native Linux ELF binary for the interactive TUI.');
        term.writeln('WebContainer can install the package, but it cannot execute that native binary.');
        term.writeln('Run Codex from the host terminal instead: npm i -g @openai/codex && codex');
      }

      async function getLoadPyodide() {
        if (!loadPyodideModule) {
          ({ loadPyodide: loadPyodideModule } = await import(/* @vite-ignore */ PYODIDE_MODULE_URL));
        }
        return loadPyodideModule;
      }

      async function getPyodide() {
        if (pyodide) return pyodide;
        term.writeln('Booting Pyodide Python runtime...');
        const loadPyodide = await getLoadPyodide();
        pyodide = await loadPyodide({
          indexURL: PYODIDE_INDEX_URL,
          stdout: (text) => term.writeln(text),
          stderr: (text) => term.writeln(text)
        });
        pyodide.setStdout({ batched: (text) => term.writeln(text) });
        pyodide.setStderr({ batched: (text) => term.writeln(text) });
        await pyodide.loadPackage('micropip');
        for (const [path, contents] of runtimeFiles) {
          writePyodideFile(path, contents);
        }
        term.writeln(`Python ${pyodide.runPython('import sys; sys.version.split()[0]')} runtime ready.`);
        return pyodide;
      }

      async function writeWebContainerFile(path, contents) {
        const wc = await getWebContainer();
        const dir = dirname(path);
        if (dir) await wc.fs.mkdir(dir, { recursive: true });
        await wc.fs.writeFile(path, contents);
      }

      function writePyodideFile(path, contents) {
        if (!pyodide) return;
        const pyDir = '/' + dirname(path);
        if (pyDir !== '/') {
          pyodide.FS.mkdirTree(pyDir);
        }
        pyodide.FS.writeFile('/' + path, contents);
      }

      async function saveRuntimeFile(pathArg, contents) {
        const path = normalizeRuntimePath(pathArg);
        runtimeFiles.set(path, contents);
        if (webcontainer) await writeWebContainerFile(path, contents);
        writePyodideFile(path, contents);
        term.writeln(`saved ${path}`);
      }

      async function pipeProcessOutput(process) {
        const reader = process.output.getReader();
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            term.write(value);
          }
        } finally {
          reader.releaseLock();
        }
      }

      async function runWebContainerCommand(command, args) {
        const wc = await getWebContainer();
        await ensureNpmWritableGlobalPrefix(wc);
        const normalized = normalizeWebContainerCommand(command, args);
        if (normalized.usedWritablePrefix) {
          term.writeln(`Using writable npm global prefix: ${NPM_GLOBAL_PREFIX}`);
        }
        const process = await wc.spawn(command, normalized.args, {
          terminal: { cols: term.cols, rows: term.rows },
          env: {
            HOME: '/home',
            PATH: `${NPM_GLOBAL_PREFIX}/bin:/usr/local/bin:/usr/bin:/bin`,
            npm_config_cache: NPM_CACHE_DIR,
            npm_config_prefix: NPM_GLOBAL_PREFIX,
            NPM_CONFIG_PREFIX: NPM_GLOBAL_PREFIX
          }
        });
        runningProcess = process;
        processInput = process.input.getWriter();
        mode = 'process';
        const outputDone = pipeProcessOutput(process);
        const exitCode = await process.exit;
        await outputDone;
        processInput.releaseLock();
        processInput = null;
        runningProcess = null;
        mode = 'shell';
        if (exitCode !== 0) {
          term.writeln(`Process exited with code ${exitCode}`);
        }
      }

      async function runBrowserJavaScript(args) {
        const isNodeEval = args[0] === '-e';
        const code = isNodeEval ? args.slice(1).join(' ') : args.join(' ');
        if (!code) {
          term.writeln('js: missing code');
          return;
        }
        const browserConsole = {
          log: (...values) => term.writeln(values.map(String).join(' ')),
          error: (...values) => term.writeln(values.map(String).join(' ')),
          warn: (...values) => term.writeln(values.map(String).join(' '))
        };
        const result = await Function('console', `"use strict"; return (async () => { ${code} })();`)(browserConsole);
        if (result !== undefined) term.writeln(String(result));
      }

      async function runJavaScriptCommand(args) {
        if (WebContainerRuntime && window.crossOriginIsolated) {
          await runWebContainerCommand('node', args);
          return;
        }
        await runBrowserJavaScript(args);
      }

      async function runPythonCommand(args) {
        const py = await getPyodide();
        if (!args.length || args[0] === '-V' || args[0] === '--version') {
          term.writeln(`Python ${py.runPython('import sys; sys.version.split()[0]')}`);
          return;
        }
        if (args[0] === '-c') {
          const code = args.slice(1).join(' ');
          if (!code) {
            term.writeln('python: missing code after -c');
            return;
          }
          await py.runPythonAsync(code);
          return;
        }

        const filePath = normalizeRuntimePath(args[0]);
        const code = runtimeFiles.get(filePath);
        if (!code) {
          term.writeln(`python: cannot open ${filePath}. Use: write ${filePath} "print('hello')"`);
          return;
        }
        await py.runPythonAsync(code);
      }

      async function runPipCommand(args) {
        const packages = args.filter((arg) => arg !== 'install');
        if (!args.length || args[0] !== 'install' || !packages.length) {
          term.writeln('pip: usage: pip install <pure-python-package>');
          return;
        }
        const py = await getPyodide();
        py.globals.set('_vortex_packages', packages);
        await py.runPythonAsync('import micropip\nawait micropip.install(list(_vortex_packages))');
        term.writeln(`installed ${packages.join(', ')}`);
      }

      function writeLinuxLimitations() {
        term.writeln('Default Linux VM image: v86 Buildroot demo kernel.');
        term.writeln('Available for kernel/serial checks; not a package-install workstation.');
        term.writeln('Missing in this image: bash, apk, node, python3, and HTTPS-capable curl.');
        term.writeln('Use WebContainer npm/Pyodide pip in Vortex shell, or run linux alpine after building /v86/alpine-initramfs.cpio.gz.');
      }

      function writeAlpineNotes() {
        term.writeln('Alpine Linux VM profile: official Alpine x86 minirootfs as a v86 initramfs.');
        term.writeln('Preinstalled: bash, curl, ca-certificates, and apk.');
        term.writeln('Networking: v86 fetch relay is enabled for DHCP/DNS/HTTP package access.');
      }

      function writeLinuxHelp() {
        term.writeln('VM commands:');
        term.writeln('  linux             Boot the default Buildroot demo profile.');
        term.writeln('  linux buildroot   Boot the Buildroot demo profile.');
        term.writeln('  linux alpine      Boot the Alpine package-manager profile.');
        term.writeln('  linux alpine wisp://host:port  Boot Alpine through a WISP full TCP relay.');
        term.writeln('  linux help        Show this VM help.');
      }

      function localApkMirrorRepository() {
        const basePath = APP_BASE;
        const base = basePath.endsWith('/') ? basePath : `${basePath}/`;
        const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);
        if (!isLocalhost) {
          return `http://${window.location.host}${base}v86/apk/main`;
        }
        const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
        return `http://${port}.external${base}v86/apk/main`;
      }

      function localApkMirrorHostAlias() {
        const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);
        if (!isLocalhost) return '';
        const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
        return `${port}.external`;
      }

      function alpineMirrorSetupCommand() {
        const repository = localApkMirrorRepository();
        const hostAlias = localApkMirrorHostAlias();
        const hostsCommand = hostAlias
          ? `grep -q ' ${hostAlias}$' /etc/hosts 2>/dev/null || printf '%s\\n' '192.168.86.1 ${hostAlias}' >> /etc/hosts; `
          : '';
        return `${hostsCommand}printf '%s\\n' '${repository}' > /etc/apk/repositories\r`;
      }

      async function resourceAvailable(url) {
        return fetch(url, { method: 'HEAD' })
          .then((res) => res.ok)
          .catch(() => false);
      }

      async function runCommand(line) {
        const args = parseArgs(line);
        const command = args.shift();
        if (!command) return;

        switch (command) {
          case 'help':
            term.writeln('── Inline run (no file needed) ──────────────────────────');
            term.writeln('  py <code>          python -c shorthand  e.g. py print(42)');
            term.writeln('  js <code>          node -e shorthand    e.g. js console.log(42)');
            term.writeln('── File workflow ────────────────────────────────────────');
            term.writeln('  write <file> "<content>"   save to VFS (use \\n for newlines)');
            term.writeln('  python hello.py | node app.js | cat hello.py | ls');
            term.writeln('── Python (Pyodide 3.13) ────────────────────────────────');
            term.writeln('  python -V | python -c "..." | python hello.py | pip install <pkg>');
            term.writeln('── Node.js (WebContainer v22) ───────────────────────────');
            term.writeln('  node -v | node -e "..." | node app.js | npm install <pkg> | npm i -g <pkg>');
            term.writeln('── Other ────────────────────────────────────────────────');
            term.writeln('  clear, date, pwd, cd, ls, cat, echo, whoami, storage');
            term.writeln('  linux | linux alpine    (optional v86 real-kernel VM)');
            break;

          case 'clear':
            term.clear();
            break;

          case 'date':
            term.writeln(new Date().toString());
            break;

          case 'pwd':
            term.writeln(cwd);
            break;

          case 'cd': {
            const next = resolvePath(args[0] || '/');
            if (next !== '/' && !(await pathExists(next))) {
              term.writeln(`cd: no such VFS path: ${next}`);
              break;
            }
            cwd = next;
            break;
          }

          case 'ls': {
            const path = resolvePath(args[0] || cwd);
            const files = await storage.listFiles(path === '/' ? '/' : path.replace(/\/$/, ''));
            if (!files.length) {
              term.writeln('(empty)');
              break;
            }
            files.forEach((file) => term.writeln(file));
            break;
          }

          case 'cat': {
            const fileArg = args[0];
            if (!fileArg) {
              term.writeln('cat: missing file path');
              break;
            }
            const runtimePath = normalizeRuntimePath(fileArg);
            if (runtimeFiles.has(runtimePath)) {
              term.writeln(runtimeFiles.get(runtimePath));
              break;
            }
            const path = resolvePath(fileArg);
            const records = await storage.readGzFileLines(path);
            if (!records.length) {
              term.writeln('(empty or missing file)');
              break;
            }
            records.forEach((record) => term.writeln(JSON.stringify(record)));
            break;
          }

          case 'append': {
            const path = resolvePath(args.shift());
            const text = args.join(' ');
            if (!path || !text) {
              term.writeln('append: usage: append <path> <text>');
              break;
            }
            await storage.appendToGzFile(path, JSON.stringify({ ts: new Date().toISOString(), text }));
            term.writeln(`appended 1 record to ${path}`);
            break;
          }

          case 'write': {
            const path = args.shift();
            const contents = args.join(' ');
            if (!path || !contents) {
              term.writeln('write: usage: write <file> <content>');
              term.writeln('       use \\n inside content for newlines, e.g.:');
              term.writeln('       write hello.py "def hi():\\n    print(42)\\nhi()"');
              break;
            }
            // unescape \n → real newline so multi-line files are possible
            await saveRuntimeFile(path, contents.replace(/\\n/g, '\n') + '\n');
            break;
          }

          case 'echo':
            term.writeln(args.join(' '));
            break;

          case 'whoami':
            term.writeln('vortex-user');
            break;

          case 'uname':
            term.writeln('Vortex OS browser-runtime shell');
            break;

          case 'storage': {
            if (!navigator.storage?.estimate) {
              term.writeln('Storage estimate is not available in this browser.');
              break;
            }
            const estimate = await navigator.storage.estimate();
            const used = Math.round((estimate.usage || 0) / 1024);
            const quota = Math.round((estimate.quota || 0) / 1024);
            term.writeln(`IndexedDB origin storage: ${used} KiB used / ${quota} KiB quota`);
            break;
          }

          case 'py':
            if (!args.length) { term.writeln('Usage: py <code>   e.g. py print(42)'); break; }
            await runPythonCommand(['-c', args.join(' ')]);
            break;

          case 'js':
            if (!args.length) { term.writeln('Usage: js <code>   e.g. js console.log(42)'); break; }
            await runJavaScriptCommand(['-e', args.join(' ')]);
            break;

          case 'node': {
            // Friendly pre-check: if first arg looks like a filename (no flag), verify it's in VFS
            const fileArg = args[0];
            if (fileArg && !fileArg.startsWith('-')) {
              const filePath = normalizeRuntimePath(fileArg);
              if (!runtimeFiles.has(filePath)) {
                term.writeln(`node: cannot open '${fileArg}' — file not in VFS.`);
                term.writeln(`  Create it first: write ${fileArg} "console.log('hello')"`);
                term.writeln(`  Or run inline:   js console.log('hello')`);
                break;
              }
            }
            if (!WebContainerRuntime) {
              if (!args.length || args[0] === '-v' || args[0] === '--version') {
                term.writeln('Node.js is unavailable in direct-file fallback mode.');
                term.writeln('Use js <code> for browser JavaScript, or run through HTTP for WebContainer Node.js.');
                break;
              }
              if (args[0] === '-e') {
                await runBrowserJavaScript(args);
                break;
              }
            }
            await runWebContainerCommand('node', args);
            break;
          }

          case 'npm':
          case 'npx':
            if (!WebContainerRuntime) {
              term.writeln(`${command} is unavailable in direct-file fallback mode.`);
              term.writeln('Run the project through HTTP for WebContainer npm support: npm run dev -- --host 127.0.0.1');
              break;
            }
            await runWebContainerCommand(command, args);
            break;

          case 'codex':
            await runCodexCommand(args);
            break;

          case 'python':
          case 'python3':
            await runPythonCommand(args);
            break;

          case 'pip':
          case 'pip3':
            await runPipCommand(args);
            break;

          case 'apt':
          case 'apt-get':
            term.writeln('apt is not available in WebContainer/Pyodide mode.');
            term.writeln('Use npm install <pkg> for Node packages, pip install <pkg> for Pyodide-compatible Python packages, or linux after v86 assets are installed.');
            break;

          case 'linux':
          case 'vm':
            await startLinuxMode(args[0] || 'buildroot', args.slice(1));
            break;

          case 'jslinux':
            term.writeln('JSLinux is an external hosted VM. For Vortex OS, the in-app real-kernel path is v86 via the linux command.');
            term.writeln('Source: https://bellard.org/jslinux/');
            break;

          default:
            {
              const ranGlobalCommand = await runGlobalWebContainerCommand(command, args);
              if (!ranGlobalCommand) {
                term.writeln(`${command}: command not found`);
              }
            }
        }
      }

      function linuxConfigFor(profile, options = []) {
        const config = {
          ...profile.config,
          netDevice: profile.config.netDevice ? { ...profile.config.netDevice } : null
        };
        const relayUrl = options.find((arg) => arg.startsWith('wisp://') || arg.startsWith('wisps://'));
        if (relayUrl) {
          config.networkRelayUrl = relayUrl;
          config.netDevice = {
            ...(config.netDevice || { type: 'ne2k' }),
            relay_url: relayUrl
          };
        }
        return config;
      }

      async function startLinuxMode(profileName = 'buildroot', options = []) {
        if (mode === 'linux') return;
        if (profileName === 'help' || profileName === '--help' || profileName === '-h') {
          writeLinuxHelp();
          return;
        }

        const profile = LINUX_PROFILES[profileName];
        if (!profile) {
          term.writeln(`Unknown Linux VM profile: ${profileName}`);
          writeLinuxHelp();
          return;
        }

        const missingResources = [];
        if (!V86LinuxBridgeRuntime) {
          term.writeln('v86 Linux is unavailable in direct-file fallback mode.');
          term.writeln('Run the project through HTTP for VM support: npm run dev -- --host 127.0.0.1');
          return;
        }
        for (const resource of profile.resources) {
          if (!(await resourceAvailable(resource))) {
            missingResources.push(resource);
          }
        }

        if (missingResources.length) {
          term.writeln(`Linux VM profile "${profileName}" is missing required assets:`);
          missingResources.forEach((resource) => term.writeln(`  ${resource}`));
          if (profileName === 'alpine') {
            term.writeln('Build it with: ./scripts/build-alpine-initramfs.sh');
          } else {
            term.writeln('Run npm install and ensure public/v86 contains libv86.js, v86.wasm, v86-fallback.wasm, and buildroot-bzimage68.bin.');
          }
          return;
        }

        term.writeln(`Starting v86 ${profile.name} Linux VM...`);
        if (profileName === 'alpine') writeAlpineNotes();
        else writeLinuxLimitations();
        mode = 'linux';
        const channel = new MessageChannel();
        linuxPort = channel.port2;
        let linuxReadyHintShown = false;
        let alpineMirrorConfigured = false;
        let linuxOutputBuffer = '';
        bridge = new V86LinuxBridgeRuntime({
          ...linuxConfigFor(profile, options),
          onStatusChange(status) {
            if (status === 'error') {
              mode = 'shell';
              term.writeln('');
              term.writeln('Returning to Vortex shell.');
              writePrompt();
            }
          }
        });

        bridge.registerTerminalPort('terminal-main', channel.port1);
        linuxPort.onmessage = (event) => {
          if (event.data && event.data.action === 'STDOUT') {
            const output = event.data.data;
            term.write(output);
            linuxOutputBuffer = (linuxOutputBuffer + output).slice(-1000);
            if (profileName === 'alpine' && !alpineMirrorConfigured && linuxOutputBuffer.includes('/ #')) {
              alpineMirrorConfigured = true;
              linuxPort.postMessage({
                action: 'STDIN',
                data: alpineMirrorSetupCommand()
              });
            }
            if (!linuxReadyHintShown && profile.readyPatterns.some((pattern) => linuxOutputBuffer.includes(pattern))) {
              linuxReadyHintShown = true;
              term.writeln('');
              profile.readyMessage.forEach((message) => term.writeln(message));
              if (profileName === 'alpine' && !alpineMirrorConfigured) {
                alpineMirrorConfigured = true;
                window.setTimeout(() => {
                  linuxPort?.postMessage({
                    action: 'STDIN',
                    data: alpineMirrorSetupCommand()
                  });
                }, 500);
              }
            }
          }
        };
        bridge.init();
      }

      async function handleShellData(data) {
        for (const char of data) {
          if (char === '\r') {
            term.write('\r\n');
            const line = input;
            input = '';
            try {
              await runCommand(line.trim());
            } catch (err) {
              term.writeln(`Error: ${err.message}`);
            }
            if (mode === 'shell') writePrompt();
          } else if (char === '\u007f') {
            if (input.length > 0) {
              input = input.slice(0, -1);
              term.write('\b \b');
            }
          } else if (char === '\u0003') {
            input = '';
            term.write('^C\r\n');
            writePrompt();
          } else if (char >= ' ' && char !== '\u007f') {
            input += char;
            term.write(char);
          }
        }
      }

      term.onData((data) => {
        if (mode === 'linux' && linuxPort) {
          linuxPort.postMessage({ action: 'STDIN', data });
        } else if (mode === 'process' && processInput) {
          if (data === '\u0003' && runningProcess) {
            runningProcess.kill();
          } else {
            processInput.write(data);
          }
        } else {
          handleShellData(data);
        }
      });

      window.vortexTerminal = {
        run: (line) => {
          if (mode === 'linux' && linuxPort) {
            linuxPort.postMessage({ action: 'STDIN', data: `${line}\r` });
            return Promise.resolve();
          }
          return runCommand(line);
        },
        send: (data) => {
          if (mode === 'linux' && linuxPort) {
            linuxPort.postMessage({ action: 'STDIN', data });
          }
        },
        getInstalledGlobalBin,
        normalizeWebContainerCommand,
        get mode() { return mode; },
        get linuxStatus() { return bridge?.status || null; },
        get webcontainerReady() { return !!webcontainer; },
        get pyodideReady() { return !!pyodide; }
      };
    }

    main().catch((err) => {
      console.error('[Terminal] Failed to initialize:', err);
      document.getElementById('term').textContent = `Terminal failed to initialize: ${err.message}`;
    });
  </script>
</body>
</html>
