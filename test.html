<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Vortex OS - Automated Browser Tests</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 20px;
    }
    h1 {
      color: #89b4fa;
      border-bottom: 2px solid #45475a;
      padding-bottom: 10px;
    }
    .test-case {
      background: #313244;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 12px;
      border-left: 5px solid #45475a;
    }
    .test-case.pass {
      border-left-color: #a6e3a1;
    }
    .test-case.fail {
      border-left-color: #f38ba8;
    }
    .status {
      font-weight: bold;
    }
    .status.pass { color: #a6e3a1; }
    .status.fail { color: #f38ba8; }
    pre {
      background: #181825;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
    }
  </style>
</head>
<body>

  <h1>Vortex OS Automated Browser Test Runner</h1>
  <div id="results">Running tests...</div>

  <script type="module">
    import { CompressedStorageEngine } from './jsonl-storage-engine.js';
    import { CapabilitySet } from './capability.js';
    import { sanitizeManifest } from './plugin-installer.js';

    async function runTests() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      const testCases = [
        {
          name: "Test 1: Initialize IndexedDB Store",
          fn: async (engine) => {
            await engine.init();
            if (engine.db !== null && engine.db.name === 'WebOSFileSystemTest') {
              return "Successfully initialized IndexedDB database.";
            }
            throw new Error("Database not initialized correctly.");
          }
        },
        {
          name: "Test 2: Append multiple compressed JSONL lines",
          fn: async (engine) => {
            const path = '/test_logs/app_events.jsonl.gz';
            // Clear prior records
            const transaction = engine.db.transaction(['files'], 'readwrite');
            await new Promise((res, rej) => {
              const req = transaction.objectStore('files').delete(path);
              req.onsuccess = res;
              req.onerror = rej;
            });

            // Append lines
            await engine.appendToGzFile(path, JSON.stringify({ event: 'system_boot', level: 'info', timestamp: 1716240000 }));
            await engine.appendToGzFile(path, JSON.stringify({ event: 'agent_start', level: 'warning', timestamp: 1716240005 }));
            await engine.appendToGzFile(path, JSON.stringify({ event: 'user_login', level: 'info', timestamp: 1716240010 }));

            return "Appended 3 records via stream pipeline and stored in IndexedDB.";
          }
        },
        {
          name: "Test 3: Decompress and verify line integrity",
          fn: async (engine) => {
            const path = '/test_logs/app_events.jsonl.gz';
            const records = await engine.readGzFileLines(path);

            if (records.length !== 3) {
              throw new Error(`Expected 3 records, but got ${records.length}`);
            }

            if (records[1].event !== 'agent_start' || records[1].level !== 'warning') {
              throw new Error(`Data corruption detected at record index 1. Got: ${JSON.stringify(records[1])}`);
            }

            return `Parsed all decompressed JSONL entries safely. Sample event: "${records[1].event}"`;
          }
        },
        {
          name: "Test 4: Concurrent simultaneous appends (no write collision)",
          fn: async (engine) => {
            const path = '/test_logs/concurrent.jsonl.gz';
            await new Promise((res, rej) => {
              const req = engine.db.transaction(['files'], 'readwrite').objectStore('files').delete(path);
              req.onsuccess = res;
              req.onerror = rej;
            });

            const COUNT = 25;
            // Fire every append at once without awaiting in between - this is the
            // scenario that loses data without a per-file serialized write queue.
            const writes = [];
            for (let i = 0; i < COUNT; i++) {
              writes.push(engine.appendToGzFile(path, JSON.stringify({ seq: i })));
            }
            await Promise.all(writes);

            const records = await engine.readGzFileLines(path);
            if (records.length !== COUNT) {
              throw new Error(`Write collision: expected ${COUNT} records, got ${records.length}`);
            }
            const seqs = new Set(records.map(r => r.seq));
            for (let i = 0; i < COUNT; i++) {
              if (!seqs.has(i)) throw new Error(`Lost record seq=${i} during concurrent writes`);
            }
            return `All ${COUNT} concurrent appends serialized without collision or data loss.`;
          }
        },
        {
          name: "Test 5: Debounced auto-save after 500ms idle",
          fn: async (engine) => {
            const path = '/test_logs/autosave.jsonl.gz';
            await new Promise((res, rej) => {
              const req = engine.db.transaction(['files'], 'readwrite').objectStore('files').delete(path);
              req.onsuccess = res;
              req.onerror = rej;
            });

            engine.queueLine(path, JSON.stringify({ msg: 'first' }));
            engine.queueLine(path, JSON.stringify({ msg: 'second' }));
            if (!engine.isDirty(path)) {
              throw new Error('File should be marked dirty immediately after queueLine().');
            }

            // Wait past the 500ms debounce window plus a margin for the flush write.
            await new Promise(r => setTimeout(r, 850));
            if (engine.isDirty(path)) {
              throw new Error('File still dirty after the auto-save window elapsed.');
            }

            const records = await engine.readGzFileLines(path);
            if (records.length !== 2 || records[0].msg !== 'first' || records[1].msg !== 'second') {
              throw new Error(`Auto-save did not persist queued lines correctly: ${JSON.stringify(records)}`);
            }
            return 'Dirty buffer auto-saved and committed after the 500ms idle window.';
          }
        },
        {
          name: "Test 6: Crash-recovery durability (reopen DB, 100% retrieval)",
          fn: async (engine) => {
            const path = '/test_logs/crash_recovery.jsonl.gz';
            await new Promise((res, rej) => {
              const req = engine.db.transaction(['files'], 'readwrite').objectStore('files').delete(path);
              req.onsuccess = res;
              req.onerror = rej;
            });

            const COUNT = 12;
            for (let i = 0; i < COUNT; i++) {
              engine.queueLine(path, JSON.stringify({ line: i, payload: 'crash-test-' + i }));
            }
            // Simulate a beforeunload durability barrier instead of waiting for the timer.
            await engine.flushAll();

            // Simulate a process restart: a fresh engine instance on the same DB.
            const recoveredEngine = new CompressedStorageEngine('WebOSFileSystemTest', 1);
            await recoveredEngine.init();
            const records = await recoveredEngine.readGzFileLines(path);

            if (records.length !== COUNT) {
              throw new Error(`Lost data after crash: expected ${COUNT}, recovered ${records.length}`);
            }
            for (let i = 0; i < COUNT; i++) {
              if (records[i].line !== i || records[i].payload !== 'crash-test-' + i) {
                throw new Error(`Corruption at line ${i}: ${JSON.stringify(records[i])}`);
              }
            }
            return `100% of ${COUNT} lines recovered intact from a fresh engine instance.`;
          }
        },
        {
          name: "Test 7: Capability — scoped FS token enforces its path scope (Bug B)",
          fn: async () => {
            const fs = new CapabilitySet(['fs:write:/reports']);
            const checks = [
              ['descendant path is in scope', fs.authorizes('fs:write:/reports', 'fs:write', '/reports/a.jsonl'), true],
              ['the scope dir itself is in scope', fs.authorizes('fs:write:/reports', 'fs:write', '/reports'), true],
              ['unrelated path is denied', fs.authorizes('fs:write:/reports', 'fs:write', '/etc/passwd'), false],
              ['sibling sharing a prefix is denied', fs.authorizes('fs:write:/reports', 'fs:write', '/reports-secret/x'), false],
              ['wrong verb is denied', fs.authorizes('fs:write:/reports', 'fs:read', '/reports/a'), false],
              ['ungranted token is denied', fs.authorizes('fs:write:/other', 'fs:write', '/other/x'), false]
            ];
            for (const [label, got, want] of checks) {
              if (got !== want) throw new Error(`${label}: got ${got}, expected ${want}`);
            }
            return `All ${checks.length} path-scope authorization checks passed.`;
          }
        },
        {
          name: "Test 8: Capability — a token only authorizes its own action (Bug A)",
          fn: async () => {
            const caps = new CapabilitySet(['system:notify', 'fs:write:/reports']);
            const checks = [
              ['system:notify authorizes a notify', caps.authorizes('system:notify', 'system:notify'), true],
              ['a notify token cannot authorize fs:write', caps.authorizes('system:notify', 'fs:write', '/reports/x'), false],
              ['a flat token rejects a scoped call', caps.authorizes('system:notify', 'system:notify', '/x'), false]
            ];
            for (const [label, got, want] of checks) {
              if (got !== want) throw new Error(`${label}: got ${got}, expected ${want}`);
            }
            return `All ${checks.length} action-token binding checks passed.`;
          }
        },
        {
          name: "Test 9: Capability — flat KB token matches by exact verb",
          fn: async () => {
            const kb = new CapabilitySet(['kb-mcp:read']);
            const checks = [
              ['kb-mcp:read authorizes a read', kb.authorizes('kb-mcp:read', 'kb-mcp:read'), true],
              ['a read token cannot authorize a write', kb.authorizes('kb-mcp:read', 'kb-mcp:write'), false]
            ];
            for (const [label, got, want] of checks) {
              if (got !== want) throw new Error(`${label}: got ${got}, expected ${want}`);
            }
            return `All ${checks.length} flat-token verb-match checks passed.`;
          }
        },
        {
          name: "Test 10: Manifest — KB-MCP permission tokens sanitize safely",
          fn: async () => {
            const manifest = sanitizeManifest({
              id: 'com.vortex.agent.analyzer',
              name: 'AI Data Analyzer',
              version: '1.0.0',
              entrypoint: 'plugin.js',
              permissions: ['kb-mcp:read', 'kb-mcp:write', 'fs:write:/reports']
            }, location.origin + '/manifest.json');

            const expected = ['kb-mcp:read', 'kb-mcp:write', 'fs:write:/reports'];
            for (const token of expected) {
              if (!manifest.permissions.includes(token)) {
                throw new Error(`Expected sanitized manifest to retain ${token}`);
              }
            }

            try {
              sanitizeManifest({
                id: 'com.vortex.bad',
                name: 'Bad',
                entrypoint: 'plugin.js',
                permissions: ['kb mcp:read']
              }, location.origin + '/manifest.json');
            } catch {
              return 'Accepted kb-mcp tokens and rejected malformed permission strings.';
            }
            throw new Error('Malformed permission token was not rejected.');
          }
        },
        {
          name: "Test 11: VFS — list files by prefix for terminal shell",
          fn: async (engine) => {
            const path = '/test_logs/list_files.jsonl.gz';
            await new Promise((res, rej) => {
              const req = engine.db.transaction(['files'], 'readwrite').objectStore('files').delete(path);
              req.onsuccess = res;
              req.onerror = rej;
            });

            await engine.appendToGzFile(path, JSON.stringify({ event: 'listed' }));
            const files = await engine.listFiles('/test_logs');
            if (!files.includes(path)) {
              throw new Error(`Expected ${path} in listFiles('/test_logs'), got ${JSON.stringify(files)}`);
            }
            return `listFiles('/test_logs') returned ${files.length} matching file(s).`;
          }
        }
      ];

      // Create engine instance specifically for testing
      const testEngine = new CompressedStorageEngine('WebOSFileSystemTest', 1);

      for (const tc of testCases) {
        const caseDiv = document.createElement('div');
        caseDiv.className = 'test-case';
        
        const titleEl = document.createElement('h3');
        titleEl.textContent = tc.name;
        caseDiv.appendChild(titleEl);

        const outPre = document.createElement('pre');
        caseDiv.appendChild(outPre);

        try {
          const msg = await tc.fn(testEngine);
          caseDiv.classList.add('pass');
          const passLabel = document.createElement('span');
          passLabel.className = 'status pass';
          passLabel.textContent = '[PASS]';
          outPre.appendChild(passLabel);
          outPre.appendChild(document.createTextNode(' ' + msg));
        } catch (err) {
          caseDiv.classList.add('fail');
          const failLabel = document.createElement('span');
          failLabel.className = 'status fail';
          failLabel.textContent = '[FAIL]';
          outPre.appendChild(failLabel);
          outPre.appendChild(document.createTextNode(` ${err.message}\nStack:\n${err.stack}`));
        }
        resultsDiv.appendChild(caseDiv);
      }
    }

    runTests();
  </script>
</body>
</html>
