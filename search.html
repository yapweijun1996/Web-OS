<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a1c;
      color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    #search-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(40, 40, 42, 0.85);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
    }

    #search-form {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 5px 12px;
      transition: border-color 0.15s;
    }

    #search-form:focus-within {
      border-color: #0a84ff;
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
    }

    .search-icon { flex-shrink: 0; color: #98989f; line-height: 1; }

    #query {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f2f2f7;
      font-size: 13px;
      min-width: 0;
    }
    #query::placeholder { color: #636366; }

    #clear-input-btn {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: #636366;
      color: #1a1a1c;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #clear-input-btn.visible { display: flex; }

    #search-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      background: #0a84ff;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    #search-btn:hover { background: #228cff; }
    #search-btn:active { background: #0070d8; }

    /* Category chips */
    #categories {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(28, 28, 30, 0.9);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.07);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      flex-shrink: 0;
      padding: 4px 12px;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: #ebebf5;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s;
    }
    .cat-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .cat-btn.active { background: #0a84ff; border-color: #0a84ff; color: #fff; }

    /* Results frame */
    #results-frame { flex: 1; border: none; background: #fff; }

    /* Home screen */
    #home {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px 24px;
      gap: 20px;
      overflow-y: auto;
    }

    .home-title { font-size: 22px; font-weight: 600; margin: 0; color: #f2f2f7; }
    .home-sub { font-size: 12px; color: #636366; margin: 0; }

    /* Recent searches */
    #recent-section {
      width: 100%;
      max-width: 420px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #98989f;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #clear-history-btn {
      background: none;
      border: none;
      color: #0a84ff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
    }
    #clear-history-btn:hover { color: #228cff; }

    #recent-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .recent-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: 12px;
      color: #ebebf5;
      cursor: pointer;
      transition: background 0.12s;
      max-width: 200px;
    }
    .recent-chip:hover { background: rgba(255, 255, 255, 0.15); }

    .recent-chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-chip-remove {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: #98989f;
      font-size: 9px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-family: inherit;
    }
    .recent-chip-remove:hover { background: rgba(255, 255, 255, 0.3); color: #f2f2f7; }

    /* Apps section */
    #apps-section { width: 100%; max-width: 420px; }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #ebebf5;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s;
      text-align: center;
      overflow: hidden;
    }
    .app-tile:hover { background: rgba(255, 255, 255, 0.14); }

    .app-tile-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 22px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      background: linear-gradient(145deg, #32ade6, #0a74d8);
      flex-shrink: 0;
    }

    .app-tile-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    .app-tile-add {
      border: 0.5px dashed rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #98989f;
    }
    .app-tile-add:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255,255,255,.35); color: #f2f2f7; }

    .app-tile-add .app-tile-icon {
      background: rgba(255, 255, 255, 0.07);
      box-shadow: none;
      font-size: 20px;
    }

    /* Manage mode */
    .apps-grid.manage-mode .app-tile { position: relative; }

    .app-tile-remove {
      display: none;
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(28, 28, 30, 0.8);
      background: #ff453a;
      color: #fff;
      font-size: 9px;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-family: inherit;
      z-index: 2;
    }
    .apps-grid.manage-mode .app-tile-remove { display: flex; }

    #manage-apps-btn, #done-manage-btn {
      background: none;
      border: none;
      color: #0a84ff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
    }
    #manage-apps-btn:hover, #done-manage-btn:hover { color: #228cff; }
    #done-manage-btn { display: none; }

    /* Quick links */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 420px;
    }

    .quick-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 12px 8px;
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #ebebf5;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s;
      text-align: center;
    }
    .quick-link:hover { background: rgba(255, 255, 255, 0.14); }
    .quick-link-icon { font-size: 20px; }
  </style>
</head>
<body>
  <div id="search-header">
    <form id="search-form" onsubmit="doSearch(); return false;">
      <span class="search-icon">
        <svg width="13" height="13" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="10" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      <input id="query" type="text" placeholder="Search the web..." autocomplete="off" spellcheck="false">
      <button type="button" id="clear-input-btn" aria-label="Clear">✕</button>
      <button type="submit" id="search-btn">Search</button>
    </form>
  </div>

  <div id="categories">
    <button class="cat-btn active" data-cat="">All</button>
    <button class="cat-btn" data-cat="images">Images</button>
    <button class="cat-btn" data-cat="videos">Videos</button>
    <button class="cat-btn" data-cat="news">News</button>
    <button class="cat-btn" data-cat="science">Science</button>
    <button class="cat-btn" data-cat="it">IT</button>
    <button class="cat-btn" data-cat="map">Maps</button>
  </div>

  <div id="home">
    <h1 class="home-title">Search</h1>
    <p class="home-sub">Powered by SearXNG · private, self-hosted</p>

    <div id="recent-section" style="display:none;">
      <div class="section-header">
        <span class="section-label">Recent</span>
        <button id="clear-history-btn">Clear</button>
      </div>
      <div id="recent-chips"></div>
    </div>

    <div id="apps-section" style="display:none;">
      <div class="section-header">
        <span class="section-label">Apps</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="manage-apps-btn">Manage</button>
          <button id="done-manage-btn">Done</button>
        </div>
      </div>
      <div id="apps-grid" class="apps-grid"></div>
    </div>

    <div class="quick-links">
      <button class="quick-link" onclick="fillAndSearch('Vortex OS web OS')">
        <span class="quick-link-icon">🌌</span>Vortex OS
      </button>
      <button class="quick-link" onclick="fillAndSearch('GitHub yapweijun1996')">
        <span class="quick-link-icon">🐱</span>GitHub
      </button>
      <button class="quick-link" onclick="fillAndSearch('MDN Web Docs')">
        <span class="quick-link-icon">📖</span>MDN Docs
      </button>
      <button class="quick-link" onclick="fillAndSearch('Claude AI Anthropic')">
        <span class="quick-link-icon">🤖</span>Claude AI
      </button>
      <button class="quick-link" onclick="fillAndSearch('npm package registry')">
        <span class="quick-link-icon">📦</span>npm
      </button>
      <button class="quick-link" onclick="fillAndSearch('CSS tricks web dev')">
        <span class="quick-link-icon">🎨</span>CSS Tricks
      </button>
    </div>
  </div>

  <iframe id="results-frame" title="Search results" style="display:none;"></iframe>

  <script>
    const SEARXNG    = 'https://search.yapweijun1996.com';
    const HISTORY_KEY = 'vortex_search_history';
    const MAX_HISTORY = 8;

    const input         = document.getElementById('query');
    const frame         = document.getElementById('results-frame');
    const home          = document.getElementById('home');
    const clearInputBtn = document.getElementById('clear-input-btn');
    const recentSection = document.getElementById('recent-section');
    const recentChips   = document.getElementById('recent-chips');
    const clearHistBtn  = document.getElementById('clear-history-btn');
    let activeCategory  = '';

    // ── History helpers ──────────────────────────────────────────
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
      catch { return []; }
    }

    function saveHistory(list) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    }

    function pushHistory(q) {
      const list = loadHistory().filter(x => x !== q);
      list.unshift(q);
      saveHistory(list.slice(0, MAX_HISTORY));
    }

    function removeHistory(q) {
      saveHistory(loadHistory().filter(x => x !== q));
      renderHistory();
    }

    function renderHistory() {
      const list = loadHistory();
      if (!list.length) { recentSection.style.display = 'none'; return; }
      recentSection.style.display = 'block';
      recentChips.innerHTML = '';
      list.forEach(q => {
        const chip = document.createElement('span');
        chip.className = 'recent-chip';

        const text = document.createElement('span');
        text.className = 'recent-chip-text';
        text.textContent = q;
        text.title = q;
        text.addEventListener('click', () => fillAndSearch(q));

        const rm = document.createElement('button');
        rm.className = 'recent-chip-remove';
        rm.textContent = '✕';
        rm.title = 'Remove';
        rm.addEventListener('click', (e) => { e.stopPropagation(); removeHistory(q); });

        chip.append(text, rm);
        recentChips.appendChild(chip);
      });
    }

    clearHistBtn.addEventListener('click', () => {
      saveHistory([]);
      renderHistory();
    });

    // ── Input live clear button ──────────────────────────────────
    input.addEventListener('input', () => {
      clearInputBtn.classList.toggle('visible', input.value.length > 0);
    });

    clearInputBtn.addEventListener('click', () => {
      input.value = '';
      clearInputBtn.classList.remove('visible');
      // Return to home if results are showing
      frame.style.display = 'none';
      home.style.display = 'flex';
      renderHistory();
      input.focus();
    });

    // ── Category pills ───────────────────────────────────────────
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        if (input.value.trim()) doSearch();
      });
    });

    // ── Search ───────────────────────────────────────────────────
    function buildUrl(q) {
      const params = new URLSearchParams({ q });
      if (activeCategory) {
        params.set('category_general', '0');
        params.set(`category_${activeCategory}`, '1');
      }
      return `${SEARXNG}/?${params}`;
    }

    function doSearch() {
      const q = input.value.trim();
      if (!q) return;
      pushHistory(q);
      home.style.display = 'none';
      frame.style.display = 'block';
      frame.src = buildUrl(q);
    }

    function fillAndSearch(q) {
      input.value = q;
      clearInputBtn.classList.add('visible');
      doSearch();
    }

    // ── Apps ─────────────────────────────────────────────────────
    const APPS_KEY      = 'vortex_installed_apps';
    const appsSection   = document.getElementById('apps-section');
    const appsGrid      = document.getElementById('apps-grid');
    const manageBtn     = document.getElementById('manage-apps-btn');
    const doneBtn       = document.getElementById('done-manage-btn');
    let manageMode      = false;

    function setManageMode(on) {
      manageMode = on;
      appsGrid.classList.toggle('manage-mode', on);
      manageBtn.style.display = on ? 'none' : '';
      doneBtn.style.display   = on ? '' : 'none';
    }

    manageBtn.addEventListener('click', () => setManageMode(true));
    doneBtn.addEventListener('click',   () => setManageMode(false));

    function uninstallApp(id) {
      let apps = [];
      try { apps = JSON.parse(localStorage.getItem(APPS_KEY) || '[]'); } catch {}
      localStorage.setItem(APPS_KEY, JSON.stringify(apps.filter(a => a.manifest.id !== id)));
      renderApps();
    }

    function renderApps() {
      let apps = [];
      try { apps = JSON.parse(localStorage.getItem(APPS_KEY) || '[]'); } catch {}
      const webApps = apps.filter(a => a.manifest && a.manifest.web_app === true);
      if (!webApps.length) { appsSection.style.display = 'none'; setManageMode(false); return; }
      appsSection.style.display = 'block';
      appsGrid.innerHTML = '';
      webApps.forEach(({ manifest, manifestUrl }) => {
        const tile = document.createElement('button');
        tile.className = 'app-tile';
        tile.title = manifest.description || manifest.name;

        const rm = document.createElement('button');
        rm.className = 'app-tile-remove';
        rm.textContent = '✕';
        rm.title = `Uninstall ${manifest.name}`;
        rm.addEventListener('click', (e) => { e.stopPropagation(); uninstallApp(manifest.id); });

        const icon = document.createElement('span');
        icon.className = 'app-tile-icon';
        icon.textContent = manifest.icon || '🌐';

        const name = document.createElement('span');
        name.className = 'app-tile-name';
        name.textContent = manifest.name;

        tile.append(rm, icon, name);
        tile.addEventListener('click', () => {
          if (manageMode) return;
          const p = window.parent;
          if (p && typeof p.openWebApp === 'function') {
            p.openWebApp(
              manifest.name,
              manifest.entrypoint,
              'linear-gradient(145deg, #32ade6, #0a74d8)',
              manifest.icon || '🌐',
              manifest.description || '',
              manifestUrl || ''
            );
          } else {
            window.open(manifest.entrypoint, '_blank', 'noopener');
          }
        });
        appsGrid.appendChild(tile);
      });

      // "＋ Add App" tile — always last, hidden in manage mode
      if (!manageMode) {
        const addTile = document.createElement('button');
        addTile.className = 'app-tile app-tile-add';
        addTile.title = 'Add App';

        const addIcon = document.createElement('span');
        addIcon.className = 'app-tile-icon';
        addIcon.textContent = '＋';

        const addName = document.createElement('span');
        addName.className = 'app-tile-name';
        addName.textContent = 'Add App';

        addTile.append(addIcon, addName);
        addTile.addEventListener('click', () => {
          const p = window.parent;
          if (p && typeof p.openAddAppModal === 'function') p.openAddAppModal();
          else window.open(location.origin + '/Web-OS/', '_blank', 'noopener');
        });
        appsGrid.appendChild(addTile);
      }
      // re-apply manage mode class after re-render
      appsGrid.classList.toggle('manage-mode', manageMode);
    }

    window.addEventListener('storage', e => { if (e.key === APPS_KEY) renderApps(); });

    // ── Init ─────────────────────────────────────────────────────
    renderApps();
    renderHistory();
    input.focus();
  </script>
</body>
</html>
